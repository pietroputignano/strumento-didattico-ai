<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bSmart | Jeux interactifs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hfle-blue: #0169B3; --hfle-orange: #EFA92C; --hfle-success: #8dc549; --hfle-error: #d84157; }
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #f1f5f9; }
        .h-titre { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--hfle-blue); text-shadow: rgb(255, 255, 255) 4px 0px 0px, rgb(255, 255, 255) 3.8px 1px 0px; }
        .h-unite-bar { background-color: var(--hfle-blue); color: white; padding: 12px; text-transform: uppercase; font-weight: 700; text-align: center; }
        .step-pill { width: 35px; height: 35px; border-radius: 10px; background: #7CB5DD; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .step-pill.active { background-color: var(--hfle-blue); transform: scale(1.1); }
        .step-pill.completed { background-color: var(--hfle-success); }
        
        /* Moduli Gioco */
        .domino-tile { border: 3px solid var(--hfle-blue); border-radius: 12px; display: flex; background: white; height: 85px; width: 190px; cursor: grab; overflow: hidden; flex-shrink: 0; }
        .tile-img { width: 50%; background: #fff; display: flex; align-items: center; justify-content: center; border-right: 2px dashed var(--hfle-blue); position: relative; }
        .tile-img img { max-height: 85%; max-width: 85%; object-fit: contain; }
        .tile-text { width: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; text-align: center; padding: 4px; }
        .drop-target { width: 190px; height: 85px; border: 3px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-weight: bold; }
        .letter-tile { width: 40px; height: 40px; background: var(--hfle-orange); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: grab; }
        .rebus-gap { display: inline-block; width: 60px; height: 40px; border: 2px dashed var(--hfle-blue); border-radius: 8px; vertical-align: middle; margin: 0 5px; background: #f8fafc; }

        /* Mapper UI */
        .modal-bg { background: rgba(0,0,0,0.85); z-index: 100; }
        .mapper-zone { position: absolute; border: 2px dashed var(--hfle-orange); background: rgba(239, 169, 44, 0.3); cursor: grab; }
        .resize-handle { position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; background: var(--hfle-blue); border-radius: 50%; cursor: se-resize; }

        /* Crossword UI */
        .cw-grid { display: grid; grid-template-columns: repeat(12, 35px); gap: 2px; justify-content: center; }
        .cw-cell-wrapper { position: relative; width: 35px; height: 35px; }
        .cw-number { position: absolute; top: 1px; left: 3px; font-size: 10px; font-weight: bold; color: var(--hfle-blue); pointer-events: none; z-index: 10; }
        .cw-cell { width: 100%; height: 100%; border: 1px solid #ccc; text-align: center; font-weight: bold; text-transform: uppercase; font-size: 16px; outline: none; }
        .cw-cell:focus { border: 2px solid var(--hfle-orange); background: #fff8e1; }
        
        .cw-play-wrapper { position: relative; width: 40px; height: 40px; }
        .cw-play-cell { width: 100%; height: 100%; border: 2px solid var(--hfle-blue); text-align: center; font-weight: bold; text-transform: uppercase; font-size: 18px; border-radius: 4px; outline: none; }
        .cw-play-cell:focus { background: #e0f2fe; }
        .cw-play-cell.correct { background-color: var(--hfle-success); color: white; border-color: var(--hfle-success); pointer-events: none; }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="mapper-modal" class="fixed inset-0 hidden flex items-center justify-center p-4 modal-bg">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl flex flex-col h-[90vh]">
            <div class="p-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="font-bold text-blue-900">🗺️ Visual Mapper - Dressing Game</h3>
                <button onclick="closeMapper()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold">Salva e Chiudi</button>
            </div>
            <div class="p-4 flex gap-4 bg-gray-50 border-b">
                <button onclick="pickImg('mapper_bg')" class="bg-white border-2 border-blue-200 px-4 py-2 rounded font-bold text-xs">1. Carica Sfondo</button>
                <button onclick="addZone()" class="bg-white border-2 border-orange-200 px-4 py-2 rounded font-bold text-xs text-orange-700">+ 2. Aggiungi Zona Incastro</button>
            </div>
            <div class="flex-grow overflow-auto p-10 bg-slate-300 flex justify-center">
                <div id="mapper-container" class="relative bg-white shadow-xl min-w-[500px] min-h-[500px]">
                    <img id="mapper-preview" src="" class="max-w-full pointer-events-none hidden">
                    <p id="mapper-hint" class="absolute inset-0 flex items-center justify-center text-gray-400 font-bold uppercase italic">Carica uno sfondo per iniziare</p>
                </div>
            </div>
        </div>
    </div>

    <div id="cw-modal" class="fixed inset-0 hidden flex items-center justify-center p-4 modal-bg">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl flex flex-col max-h-[95vh]">
            <div class="p-4 border-b flex justify-between items-center bg-orange-50">
                <h3 class="font-bold text-orange-900">🧩 Costruttore Cruciverba</h3>
                <div class="flex gap-2">
                    <button onclick="findCWWords()" class="bg-blue-500 text-white px-4 py-2 rounded-full font-bold text-sm">🔍 Genera Numeri e Definizioni</button>
                    <button onclick="closeCWBuilder()" class="bg-orange-600 text-white px-6 py-2 rounded-full font-bold text-sm">Salva Griglia</button>
                </div>
            </div>
            <div class="flex-grow overflow-auto p-6 bg-slate-200 flex flex-col items-center">
                <div id="cw-builder-grid" class="cw-grid bg-white p-4 shadow-lg rounded-lg mb-6"></div>
                <div id="cw-clues-container" class="w-full bg-white p-4 shadow-lg rounded-lg hidden"></div>
            </div>
        </div>
    </div>

    <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row gap-4">
        <div class="lg:w-1/3 bg-white p-5 rounded-xl shadow-lg border-t-8 border-blue-800 overflow-y-auto max-h-[95vh] text-xs">
            <h2 class="text-xl font-bold text-blue-900 mb-4 border-b pb-2 uppercase">bSmart | Jeux interactifs</h2>
            
            <div class="space-y-6">
                <div class="grid grid-cols-2 gap-2">
                    <div><p class="font-bold uppercase mb-1 text-[10px]">Unité</p><input id="in-unite" type="text" class="w-full p-2 border rounded" placeholder="UNITÉ 4"></div>
                    <div><p class="font-bold uppercase mb-1 text-[10px]">Titre</p><input id="in-titre" type="text" class="w-full p-2 border rounded" placeholder="Le déguisement"></div>
                </div>

                <div class="p-4 bg-blue-50 rounded-xl border border-blue-200 space-y-3">
                    <p class="font-black text-blue-800 text-lg uppercase">Facile</p>
                    <input id="con-f" type="text" class="w-full p-2 border rounded" value="Écoute e choisis la bonne image.">
                    <select id="type-f" class="type-sel w-full p-2 border rounded bg-white font-bold" onchange="toggleToolBtns('f')"></select>
                    <div class="flex gap-2">
                        <button onclick="pickAud('aud-f')" class="flex-1 bg-white border p-2 rounded shadow-sm hover:bg-gray-50">🎵 Audio Consigne</button>
                        <button id="btn-map-f" onclick="openMapper()" class="flex-1 bg-orange-100 border border-orange-300 p-2 rounded shadow-sm font-bold hidden">🗺️ Mapper</button>
                        <button id="btn-cw-f" onclick="openCWBuilder()" class="flex-1 bg-blue-100 border border-blue-300 p-2 rounded shadow-sm font-bold hidden">🧩 Cruciverba</button>
                    </div>
                </div>

                <div class="p-4 bg-orange-50 rounded-xl border border-orange-200 space-y-3">
                    <p class="font-black text-orange-800 text-lg uppercase">Difficile</p>
                    <input id="con-d" type="text" class="w-full p-2 border rounded" value="Complète les mots croisés.">
                    <select id="type-d" class="type-sel w-full p-2 border rounded bg-white font-bold" onchange="toggleToolBtns('d')"></select>
                    <div class="flex gap-2">
                        <button onclick="pickAud('aud-d')" class="flex-1 bg-white border p-2 rounded shadow-sm hover:bg-gray-50">🎵 Audio Consigne</button>
                        <button id="btn-map-d" onclick="openMapper()" class="flex-1 bg-orange-100 border border-orange-300 p-2 rounded shadow-sm font-bold hidden">🗺️ Mapper</button>
                        <button id="btn-cw-d" onclick="openCWBuilder()" class="flex-1 bg-blue-100 border border-blue-300 p-2 rounded shadow-sm font-bold hidden">🧩 Cruciverba</button>
                    </div>
                </div>

                <div>
                    <p class="font-bold uppercase mb-1">Dati / Parole (separati da ;)</p>
                    <textarea id="items-list" class="w-full h-24 p-2 border rounded" placeholder="armoire; couette; fenêtre; lampe"></textarea>
                    <p class="text-[9px] text-gray-500 italic mt-1">Non serve compilare questo campo per il Cruciverba (usa il pulsante 🧩).</p>
                </div>

                <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <p class="font-bold text-gray-800 uppercase mb-2">Suoni Feedback</p>
                    <div class="flex gap-2">
                        <button onclick="pickAud('global_ok')" class="flex-1 bg-white border p-1 rounded shadow-sm hover:bg-green-50 text-[10px]">🔊 Suono Esatto</button>
                        <button onclick="pickAud('global_ko')" class="flex-1 bg-white border p-1 rounded shadow-sm hover:bg-red-50 text-[10px]">🔊 Suono Errore</button>
                    </div>
                </div>
            </div>
            
            <button onclick="initGame()" class="w-full mt-6 bg-blue-700 text-white py-4 rounded-xl font-black text-sm shadow-xl hover:bg-blue-800 transition">🚀 AGGIORNA ANTEPRIMA</button>
            <button onclick="exportToZIP()" class="w-full mt-3 bg-green-600 text-white py-4 rounded-xl font-black text-sm shadow-xl hover:bg-green-700 transition">📥 SCARICA PACCHETTO ZIP</button>
        </div>

        <div class="lg:w-2/3 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[700px] relative">
            <div id="res-unite" class="h-unite-bar">UNITÉ</div>
            <div class="px-6 py-4 flex justify-between items-center border-b">
                <h1 id="res-titre" class="h-titre text-2xl md:text-3xl uppercase">TITRE</h1>
                <div class="flex gap-2">
                    <button id="btn-f-view" onclick="switchLvl('facile')" class="px-5 py-1 rounded-full text-xs font-black border-2 border-blue-900 bg-blue-900 text-white transition">FACILE</button>
                    <button id="btn-d-view" onclick="switchLvl('difficile')" class="px-5 py-1 rounded-full text-xs font-black border-2 border-blue-900 text-blue-900 transition">DIFFICILE</button>
                </div>
            </div>

            <div class="p-8 flex-grow flex flex-col items-center">
                <div class="flex items-center gap-3 mb-6 bg-slate-50 px-8 py-3 rounded-full border border-slate-200 shadow-sm">
                    <p id="res-consigne" class="italic text-gray-700 font-bold text-lg"></p>
                    <button onclick="playConsigne()" class="text-blue-600 text-2xl hover:scale-125 transition">🔊</button>
                </div>
                <div id="main-content" class="w-full flex flex-col items-center gap-6"></div>
                <div id="pool" class="mt-auto p-6 w-full flex flex-wrap justify-center gap-6 border-t border-dashed border-slate-200"></div>
            </div>
            <div id="nav-step" class="p-5 bg-slate-50 border-t flex justify-center gap-3 flex-wrap"></div>
        </div>
    </div>

    <input type="file" id="imgInp" class="hidden" accept="image/*" onchange="handleImg(event)">
    <input type="file" id="audInp" class="hidden" accept="audio/*" onchange="handleAud(event)">

    <script>
        const types = [
            {id: 'domino', n: 'Domino Chain'},
            {id: 'anagramme', n: 'Anagramme (Ordering)'},
            {id: 'dressing', n: 'Dressing Game (Mapper)'},
            {id: 'rebus', n: 'Texte à trous (Rebus)'},
            {id: 'crossword', n: 'Mots Croisés (Cruciverba)'}
        ];

        let items = [], dbImg = {}, dbAud = {}, curStep = 0, curLvl = 'facile', status = [], activeKey = "";
        let mappedZones = [];
        let cwData = []; // {x, y, char, num}
        let cwClues = []; // {num, dir, word, clue}

        window.onload = () => {
            document.querySelectorAll('.type-sel').forEach(s => { s.innerHTML = types.map(t=>`<option value="${t.id}">${t.n}</option>`).join(''); });
            toggleToolBtns('f'); toggleToolBtns('d');
            buildCWGrid();
        };

        function toggleToolBtns(l) {
            const type = document.getElementById(`type-${l}`).value;
            document.getElementById(`btn-map-${l}`).classList.toggle('hidden', type !== 'dressing');
            document.getElementById(`btn-cw-${l}`).classList.toggle('hidden', type !== 'crossword');
        }

        /* --- VISUAL MAPPER LOGIC --- */
        function openMapper() { document.getElementById('mapper-modal').classList.remove('hidden'); }
        function closeMapper() { document.getElementById('mapper-modal').classList.add('hidden'); initGame(); }
        function addZone() {
            const z = document.createElement('div'); z.className = 'mapper-zone'; z.style.cssText = "width:20%; height:20%; left:40%; top:40%;";
            const word = items[mappedZones.length] || "item";
            z.innerHTML = `<input class="w-16 text-[8px] font-bold text-center border-none bg-white/80" value="${word}" onchange="this.parentElement.dataset.word=this.value"><div class="resize-handle"></div>`;
            z.dataset.word = word; document.getElementById('mapper-container').appendChild(z); makeDraggable(z);
        }
        function makeDraggable(el) {
            let container = document.getElementById('mapper-container');
            el.onmousedown = (e) => {
                if(e.target.tagName === 'INPUT' || e.target.classList.contains('resize-handle')) return;
                let sx = e.clientX, sy = e.clientY;
                document.onmousemove = (ev) => {
                    let dx = ev.clientX-sx, dy = ev.clientY-sy; sx=ev.clientX; sy=ev.clientY;
                    el.style.left = (el.offsetLeft + dx)/container.offsetWidth*100 + '%'; el.style.top = (el.offsetTop + dy)/container.offsetHeight*100 + '%';
                };
                document.onmouseup = () => { document.onmousemove = null; saveZones(); };
            };
            el.querySelector('.resize-handle').onmousedown = (e) => {
                e.stopPropagation();
                document.onmousemove = (ev) => { el.style.width = (ev.clientX - el.getBoundingClientRect().left)/container.offsetWidth*100 + '%'; el.style.height = (ev.clientY - el.getBoundingClientRect().top)/container.offsetHeight*100 + '%'; };
                document.onmouseup = () => { document.onmousemove = null; saveZones(); };
            };
        }
        function saveZones() { mappedZones = Array.from(document.querySelectorAll('.mapper-zone')).map(z => ({ word: z.dataset.word, left: z.style.left, top: z.style.top, width: z.style.width, height: z.style.height })); }

        /* --- CROSSWORD BUILDER LOGIC --- */
        function openCWBuilder() { document.getElementById('cw-modal').classList.remove('hidden'); }
        function buildCWGrid() {
            let html = '';
            for(let y=0; y<12; y++) {
                for(let x=0; x<12; x++) {
                    html += `<div class="cw-cell-wrapper"><input type="text" maxlength="1" class="cw-cell" data-x="${x}" data-y="${y}"></div>`;
                }
            }
            document.getElementById('cw-builder-grid').innerHTML = html;
        }

        // Funzione Cuore per rilevare parole e inserire Definizioni
        function findCWWords() {
            let grid = [];
            for(let y=0; y<12; y++) {
                grid[y] = [];
                for(let x=0; x<12; x++) {
                    grid[y][x] = document.querySelector(`.cw-cell[data-x="${x}"][data-y="${y}"]`).value.trim().toUpperCase();
                }
            }

            let words = []; let counter = 1;

            // Scansione Orizzontale
            for(let y=0; y<12; y++) {
                let currWord = ""; let startX = -1;
                for(let x=0; x<=12; x++) {
                    if(x<12 && grid[y][x]) { if(currWord === "") startX = x; currWord += grid[y][x]; }
                    else { if(currWord.length > 1) words.push({ word: currWord, x: startX, y: y, dir: 'h' }); currWord = ""; }
                }
            }
            // Scansione Verticale
            for(let x=0; x<12; x++) {
                let currWord = ""; let startY = -1;
                for(let y=0; y<=12; y++) {
                    if(y<12 && grid[y][x]) { if(currWord === "") startY = y; currWord += grid[y][x]; }
                    else { if(currWord.length > 1) words.push({ word: currWord, x: x, y: startY, dir: 'v' }); currWord = ""; }
                }
            }

            if(words.length === 0) { alert("Nessuna parola trovata. Assicurati che le parole abbiano almeno 2 lettere incrociate."); return; }

            // Assegna numeri alle caselle iniziali
            let starts = {};
            words.forEach(w => {
                let key = `${w.x}-${w.y}`;
                if(!starts[key]) starts[key] = counter++;
                w.num = starts[key];
            });

            // Mostra i numeri sulla griglia visuale
            document.querySelectorAll('.cw-number').forEach(e => e.remove());
            Object.keys(starts).forEach(key => {
                let [x,y] = key.split('-');
                let cellWrap = document.querySelector(`.cw-cell[data-x="${x}"][data-y="${y}"]`).parentElement;
                let span = document.createElement('span'); span.className = 'cw-number'; span.innerText = starts[key];
                cellWrap.appendChild(span);
            });

            // Crea campi per le definizioni
            let cluesHtml = `<h4 class="font-bold text-blue-900 border-b pb-2 mb-3">Definizioni per le parole trovate</h4><div class="grid grid-cols-2 gap-4">`;
            words.sort((a,b) => a.num - b.num).forEach(w => {
                let label = w.dir === 'h' ? 'Orizzontale' : 'Verticale';
                let prevClue = cwClues.find(c => c.word === w.word && c.dir === w.dir)?.clue || "";
                cluesHtml += `<div><label class="text-xs font-bold text-gray-700 block">${w.num}. ${label} (${w.word})</label>
                    <input type="text" class="cw-clue-input w-full border border-gray-300 rounded p-2 text-xs focus:border-blue-500" data-word="${w.word}" data-num="${w.num}" data-dir="${w.dir}" value="${prevClue}" placeholder="Es: Si usa per scrivere..."></div>`;
            });
            cluesHtml += `</div>`;
            
            const cont = document.getElementById('cw-clues-container');
            cont.innerHTML = cluesHtml; cont.classList.remove('hidden');
        }

        function closeCWBuilder() {
            cwData = []; cwClues = [];
            // Salva Caselle e Numerini
            document.querySelectorAll('.cw-cell').forEach(inp => {
                if(inp.value.trim() !== '') {
                    let numSpan = inp.parentElement.querySelector('.cw-number');
                    cwData.push({ x: parseInt(inp.dataset.x), y: parseInt(inp.dataset.y), char: inp.value.toUpperCase(), num: numSpan ? parseInt(numSpan.innerText) : null });
                }
            });
            // Salva Definizioni
            document.querySelectorAll('.cw-clue-input').forEach(inp => {
                cwClues.push({ num: parseInt(inp.dataset.num), dir: inp.dataset.dir, word: inp.dataset.word, clue: inp.value || inp.dataset.word });
            });
            document.getElementById('cw-modal').classList.add('hidden');
            initGame();
        }

        /* --- GAME LOGIC --- */
        function initGame() {
            items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i);
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('res-titre').innerText = document.getElementById('in-titre').value || "ACTIVITÉ";
            status = new Array(items.length).fill('pending');
            toggleToolBtns('f'); toggleToolBtns('d');
            loadStep(0);
        }

        function loadStep(idx) {
            curStep = idx; renderNav();
            const stage = document.getElementById('main-content');
            const pool = document.getElementById('pool');
            const typeId = curLvl === 'facile' ? 'type-f' : 'type-d';
            const type = document.getElementById(typeId).value;
            
            document.getElementById('res-consigne').innerText = curLvl === 'facile' ? document.getElementById('con-f').value : document.getElementById('con-d').value;
            pool.innerHTML = '';
            
            if(type === 'crossword') {
                if(cwData.length === 0) { stage.innerHTML = "<p class='text-gray-400'>Usa il Costruttore Cruciverba (🧩) per creare la griglia e le definizioni.</p>"; return; }
                
                // Disegna la griglia di gioco e le definizioni
                let gridHtml = '<div class="grid gap-1 p-6 bg-blue-50 rounded-xl border-2 border-blue-200" style="grid-template-columns: repeat(12, 40px);">';
                for(let y=0; y<12; y++) {
                    for(let x=0; x<12; x++) {
                        let cell = cwData.find(c => c.x === x && c.y === y);
                        if(cell) gridHtml += `<div class="cw-play-wrapper"><span class="cw-number">${cell.num || ''}</span><input type="text" maxlength="1" class="cw-play-cell" data-ans="${cell.char}" oninput="checkCrossword()"></div>`;
                        else gridHtml += `<div class="w-10 h-10"></div>`;
                    }
                }
                gridHtml += '</div>';

                let cluesHtml = '<div class="w-full max-w-2xl bg-white border rounded-xl p-4 shadow mt-6"><h3 class="font-bold text-blue-900 border-b pb-2 mb-2">Définitions</h3><div class="flex flex-wrap gap-4 text-sm text-gray-700">';
                cwClues.forEach(c => {
                    cluesHtml += `<div class="w-[45%]"><b>${c.num}. ${c.dir === 'h' ? 'Horizontal' : 'Vertical'} :</b> ${c.clue}</div>`;
                });
                cluesHtml += '</div></div>';

                stage.innerHTML = `<div class="flex flex-col items-center w-full">${gridHtml}${cluesHtml}</div>`;
                document.getElementById('nav-step').innerHTML = ''; // Niente steps nel cruciverba
                return;
            }

            if(items.length === 0) return;
            const word = items[idx];

            if(type === 'dressing') {
                const bg = dbImg['mapper_bg'] ? `<img src="${dbImg['mapper_bg']}" class="max-h-full">` : `<div class="p-10 text-gray-400">Usa Mapper per lo sfondo</div>`;
                const zone = mappedZones.find(z => z.word.toLowerCase() === word.toLowerCase());
                const targetHtml = zone ? `<div id="target" class="absolute border-2 border-dashed border-blue-500 bg-blue-100/30 rounded-lg flex items-center justify-center transition-all duration-300" style="left:${zone.left}; top:${zone.top}; width:${zone.width}; height:${zone.height}"></div>` : '';
