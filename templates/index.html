<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur FLE Hachette Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
        .h-unite { background-color: #1e3a8a; color: white; padding: 12px 20px; font-weight: bold; text-transform: uppercase; }
        .h-activite { background-color: #f1f5f9; color: #475569; padding: 10px 20px; font-weight: bold; border-bottom: 2px solid #e2e8f0; }
        .btn-lvl { padding: 6px 20px; border-radius: 999px; border: 2px solid #1e3a8a; color: #1e3a8a; font-weight: bold; transition: 0.2s; }
        .btn-lvl.active { background-color: #1e3a8a; color: white; }
        .domino-card { border: 2px solid #1e3a8a; border-radius: 8px; width: 130px; background: white; cursor: move; }
        .img-placeholder { height: 90px; background: #f8fafc; display: flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; position: relative; }
        .img-placeholder img { width: 100%; height: 100%; object-fit: cover; }
        .img-placeholder:hover::after { content: "CHANGER"; position: absolute; background: rgba(0,0,0,0.5); color: white; font-size: 10px; padding: 2px 5px; }
    </style>
</head>
<body class="bg-slate-200 p-4">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div class="lg:w-1/3 bg-white p-5 rounded-lg shadow-xl space-y-4 max-h-screen overflow-y-auto">
            <h2 class="text-xl font-bold text-blue-900 border-b pb-2">Configuration</h2>
            
            <div class="bg-indigo-50 p-3 rounded border border-indigo-200">
                <textarea id="rawText" class="w-full h-24 p-2 text-sm border rounded" placeholder="Incolla testo unità..."></textarea>
                <button onclick="analizzaConAI()" id="btn-ai" class="w-full mt-2 bg-indigo-600 text-white py-2 rounded text-xs font-bold hover:bg-indigo-700">✨ COMPILA CON AI</button>
            </div>

            <div>
                <label class="block text-xs font-bold text-blue-800">UNITÉ</label>
                <input id="in-unite" type="text" class="w-full p-2 border rounded text-sm">
            </div>

            <div class="grid grid-cols-1 gap-3">
                <div class="p-3 bg-blue-50 rounded">
                    <label class="block text-xs font-bold">CONSIGNE FACILE</label>
                    <input id="con-f" type="text" class="w-full p-2 border rounded text-sm mb-2">
                    <select id="type-f" class="w-full p-2 border rounded text-xs"><option value="drag">Drag & Drop</option></select>
                </div>
                <div class="p-3 bg-slate-50 rounded">
                    <label class="block text-xs font-bold">CONSIGNE DIFFICILE</label>
                    <input id="con-d" type="text" class="text-sm w-full p-2 border rounded mb-2">
                    <select id="type-d" class="w-full p-2 border rounded text-xs"><option value="anagramme">Anagramme</option></select>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold">ITEMS (separati da ;)</label>
                <textarea id="items-list" oninput="aggiornaAnteprima()" class="w-full h-20 p-2 border rounded text-sm"></textarea>
            </div>

            <button onclick="downloadResource()" class="w-full bg-green-600 text-white py-3 rounded font-bold hover:bg-green-700 transition">💾 SCARICA RISORSA (.HTML)</button>
        </div>

        <div class="lg:w-2/3">
            <div id="capture-area" class="bg-white rounded-lg shadow-2xl overflow-hidden min-h-[600px]">
                <div id="res-unite" class="h-unite">UNITÉ</div>
                <div id="res-activite" class="h-activite">ACTIVITÉ</div>
                
                <div class="p-6">
                    <div class="flex gap-3 mb-6">
                        <button id="b-f" class="btn-lvl active" onclick="setLvl('f')">Niveau Facile</button>
                        <button id="b-d" class="btn-lvl" onclick="setLvl('d')">Niveau Difficile</button>
                    </div>
                    <p id="res-consigne" class="italic text-slate-600 mb-6 text-lg border-l-4 border-blue-200 pl-4"></p>
                    <div id="game-area" class="p-4 flex flex-wrap gap-4 justify-center items-start"></div>
                </div>
            </div>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleImage(event)">

    <script>
        let currentLevel = 'f';
        let itemImages = {}; // Qui salviamo le immagini caricate (base64)
        let activeItemForImage = null;

        async function analizzaConAI() {
            const raw = document.getElementById('rawText').value;
            const btn = document.getElementById('btn-ai');
            btn.innerText = "⏳...";
            const r = await fetch('/parse_text', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({testo:raw})});
            const d = await r.json();
            document.getElementById('in-unite').value = d.unite;
            document.getElementById('con-f').value = d.consigne_f;
            document.getElementById('con-d').value = d.consigne_d;
            document.getElementById('items-list').value = d.items;
            btn.innerText = "✨ COMPILA CON AI";
            aggiornaAnteprima();
        }

        function openImagePicker(itemName) {
            activeItemForImage = itemName;
            document.getElementById('fileInput').click();
        }

        function handleImage(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                itemImages[activeItemForImage] = event.target.result;
                aggiornaAnteprima();
            };
            reader.readAsDataURL(file);
        }

        function aggiornaAnteprima() {
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('res-activite').innerText = "Le Domino";
            setLvl(currentLevel);
        }

        function setLvl(l) {
            currentLevel = l;
            document.getElementById('b-f').classList.toggle('active', l === 'f');
            document.getElementById('b-d').classList.toggle('active', l === 'd');
            const items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i!=="");
            const area = document.getElementById('game-area');
            
            if(l === 'f') {
                document.getElementById('res-consigne').innerText = document.getElementById('con-f').value;
                area.innerHTML = `<div id="sortable-grid" class="flex flex-wrap gap-4 justify-center">
                    ${items.map(i => `
                        <div class="domino-card" data-id="${i}">
                            <div class="img-placeholder" onclick="openImagePicker('${i}')">
                                ${itemImages[i] ? `<img src="${itemImages[i]}">` : `<span class="text-xs text-slate-400">📷 Opz. A/B</span>`}
                            </div>
                            <div class="p-2 text-center font-bold text-xs border-t">${i}</div>
                        </div>
                    `).join('')}
                </div>`;
                new Sortable(document.getElementById('sortable-grid'), { animation: 150 });
            } else {
                document.getElementById('res-consigne').innerText = document.getElementById('con-d').value;
                area.innerHTML = items.map(i => `
                    <div class="p-3 border rounded flex items-center gap-3 bg-white w-full md:w-5/12">
                        <div class="w-12 h-12 border rounded overflow-hidden">
                            ${itemImages[i] ? `<img src="${itemImages[i]}" class="w-full h-full object-cover">` : `🖼️`}
                        </div>
                        <input type="text" class="flex-grow p-1 border-b-2 border-blue-200 outline-none text-center font-bold uppercase" 
                               placeholder="${i.split('').sort(()=>Math.random()-0.5).join('')}">
                    </div>
                `).join('');
            }
        }

        function downloadResource() {
    const unite = document.getElementById('in-unite').value || "UNITÉ";
    const activite = "Le Domino";
    const consigne = currentLevel === 'f' ? document.getElementById('con-f').value : document.getElementById('con-d').value;
    const gameContent = document.getElementById('game-area').innerHTML;

    const fullHtml = `
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${unite}</title>
    <script src="https://cdn.tailwindcss.com"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"><\/script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"><\/script>
    <style>
        body { background-color: #f1f5f9; font-family: sans-serif; }
        .h-unite { background: #1e3a8a; color: white; padding: 15px; font-weight: bold; text-transform: uppercase; text-align: center; }
        .h-activite { background: #e2e8f0; color: #475569; padding: 10px; font-weight: bold; border-bottom: 2px solid #cbd5e1; text-align: center; }
        .domino-card { border: 2px solid #1e3a8a; border-radius: 8px; width: 130px; background: white; display: inline-block; margin: 10px; cursor: move; transition: transform 0.2s; }
        .domino-card:active { transform: scale(1.05); }
        .img-box { height: 90px; border-bottom: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .img-box img { width: 100%; height: 100%; object-fit: cover; }
        .btn-check { background: #10b981; color: white; padding: 10px 25px; border-radius: 999px; font-weight: bold; margin-top: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="h-unite">${unite}</div>
    <div class="h-activite">${activite}</div>
    <div class="max-w-4xl mx-auto p-6 text-center">
        <p class="italic text-slate-600 mb-8 text-xl">${consigne}</p>
        <div id="game-container" class="flex flex-wrap justify-center gap-4">
            ${gameContent}
        </div>
        <button onclick="verifie()" class="btn-check">VÉRIFIER</button>
    </div>

    <script>
        // Riattiva il Drag & Drop nel file scaricato
        const el = document.getElementById('game-container');
        if (el.querySelector('.domino-card')) {
            new Sortable(el, { animation: 150 });
        }

        function verifie() {
            confetti();
            alert("Bravo ! Tu as terminé l'exercice.");
        }
    <\/script>
</body>
</html>`;

    const blob = new Blob([fullHtml], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${unite.replace(/\s+/g, '_')}.html`;
    a.click();
}
    </script>
</body>
</html>
