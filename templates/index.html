<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur FLE - Responsive Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f1f5f9; }
        .h-unite { background-color: #1e3a8a; color: white; padding: 15px; font-weight: bold; text-transform: uppercase; text-align: center; }
        .h-activite { background-color: #f8fafc; color: #475569; padding: 10px 20px; font-weight: bold; border-bottom: 2px solid #e2e8f0; }
        
        /* Tessere Responsive */
        .domino-tile { border: 3px solid #1e3a8a; border-radius: 12px; display: flex; background: white; overflow: hidden; height: 80px; width: 180px; cursor: grab; flex-shrink: 0; }
        .tile-img { width: 50%; background: #fff; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #1e3a8a; overflow: hidden; }
        .tile-img img { max-height: 90%; max-width: 90%; object-fit: contain; }
        .tile-text { width: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; text-align: center; padding: 4px; }
        
        .step-pill { width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: bold; border: 2px solid #cbd5e1; }
        .step-pill.active { border-color: #1e3a8a; color: #1e3a8a; background: #eff6ff; }
        
        .drop-target { width: 180px; height: 80px; border: 3px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-weight: bold; font-size: 12px; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div class="lg:w-1/3 bg-white p-4 rounded-xl shadow-lg space-y-4">
            <h2 class="font-bold text-blue-900 border-b pb-2">CONFIGURAZIONE</h2>
            <div class="space-y-3 text-xs">
                <input id="in-unite" type="text" class="w-full p-2 border rounded" placeholder="Unité 1">
                <input id="in-activite" type="text" class="w-full p-2 border rounded" placeholder="Titre Activité">
                
                <div class="p-2 bg-blue-50 rounded">
                    <p class="font-bold mb-1">Livello Facile</p>
                    <input id="con-f" type="text" class="w-full p-2 border rounded mb-1" value="Relie i dominos.">
                    <button onclick="pickAud('con-f')" class="bg-slate-200 px-2 py-1 rounded">🎵 Audio Consegna</button>
                </div>

                <textarea id="items-list" class="w-full h-24 p-2 border rounded" placeholder="lit; armoire; tapis"></textarea>
            </div>
            <button onclick="updatePreview()" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold">AGGIORNA ANTEPRIMA</button>
            <button onclick="downloadGame()" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold text-sm">💾 SCARICA HTML</button>
        </div>

        <div id="capture-area" class="lg:w-2/3 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[500px]">
            <div id="res-unite" class="h-unite text-sm md:text-base">UNITÉ 1</div>
            <div class="h-activite flex justify-between items-center text-xs md:text-sm">
                <span id="txt-activite">ACTIVITÉ</span>
                <div class="flex gap-1">
                    <button id="btn-f" onclick="switchLevel('f')" class="px-3 py-1 rounded-full font-bold border-2 border-blue-800 bg-blue-800 text-white">FACILE</button>
                    <button id="btn-d" onclick="switchLevel('d')" class="px-3 py-1 rounded-full font-bold border-2 border-blue-800 text-blue-800">DIFFICILE</button>
                </div>
            </div>

            <div class="p-4 md:p-8 flex-grow flex flex-col items-center">
                <div class="flex items-center gap-2 mb-6">
                    <p id="res-consigne" class="italic text-gray-600 text-sm md:text-lg"></p>
                    <button onclick="playAud('consigne')" class="text-blue-600 text-xl">🔊</button>
                </div>
                
                <div id="game-stage" class="w-full flex flex-col items-center gap-6">
                    </div>

                <div id="options-pool" class="mt-10 flex flex-wrap justify-center gap-3 w-full"></div>
            </div>

            <div id="step-nav" class="p-3 bg-slate-50 border-t flex justify-center gap-1 flex-wrap"></div>
        </div>
    </div>

    <input type="file" id="imgInp" class="hidden" accept="image/*" onchange="saveImg(event)">
    <input type="file" id="audInp" class="hidden" accept="audio/*" onchange="saveAud(event)">

    <script>
        let items = [];
        let curLvl = 'f', curStep = 0;
        let dbImg = {}, dbAud = {};
        let activeKey = "";

        function updatePreview() {
            items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i!=="");
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('txt-activite').innerText = document.getElementById('in-activite').value || "ACTIVITÉ";
            curStep = 0;
            loadStep(0);
        }

        function loadStep(idx) {
            curStep = idx;
            renderNav();
            const stage = document.getElementById('game-stage');
            const pool = document.getElementById('options-pool');
            const word = items[idx];
            
            if(curLvl === 'f') {
                document.getElementById('res-consigne').innerText = document.getElementById('con-f').value;
                // Logica Domino Chain
                stage.innerHTML = `
                    <div class="flex flex-col md:flex-row items-center gap-4">
                        <div class="domino-tile opacity-60 bg-slate-100">
                            <div class="tile-img">?</div>
                            <div class="tile-text">${word}</div>
                        </div>
                        <div class="text-2xl text-blue-400 rotate-90 md:rotate-0">➜</div>
                        <div id="drop-zone" class="drop-target">POSER ICI</div>
                    </div>
                `;
                
                pool.innerHTML = items.map(it => `
                    <div class="domino-tile shadow-md" data-word="${it}" id="tile-${it}">
                        <div class="tile-img" onclick="pickImg('${it}')">${dbImg[it]?`<img src="${dbImg[it]}">`:'📷'}</div>
                        <div class="tile-text">${it}</div>
                    </div>
                `).join('');

                // Inizializza Sortable per il trascinamento reale
                new Sortable(pool, { group: { name: 'domino', pull: 'clone', put: false }, sort: false });
                new Sortable(document.getElementById('drop-zone'), { 
                    group: 'domino', 
                    onAdd: function(evt) {
                        const draggedWord = evt.item.getAttribute('data-word');
                        const nextRequired = items[curStep + 1] || items[0];
                        if(draggedWord === nextRequired) {
                            confetti();
                            setTimeout(() => { if(curStep < items.length-1) loadStep(curStep+1); else alert("FINI !"); }, 1000);
                        } else {
                            alert("Réessaie !");
                            evt.item.remove();
                        }
                    }
                });

            } else {
                // Logica Anagramma (già funzionante, resa responsive)
                document.getElementById('res-consigne').innerText = document.getElementById('con-d').value;
                pool.innerHTML = ""; // Pulisce il pool del domino
                const shuffled = word.split('').sort(()=>Math.random()-0.5);
                stage.innerHTML = `
                    <div class="flex flex-col items-center gap-4">
                        <div class="w-32 h-32 border-2 border-blue-900 rounded-lg overflow-hidden bg-white" onclick="pickImg('${word}')">
                            ${dbImg[word]?`<img src="${dbImg[word]}" class="w-full h-full object-contain">`:'📷'}
                        </div>
                        <div id="slots" class="flex flex-wrap justify-center gap-1">
                            ${word.split('').map(()=>`<div class="w-10 h-10 border-2 border-dashed border-blue-200 rounded flex items-center justify-center font-bold"></div>`).join('')}
                        </div>
                        <div id="letters" class="flex flex-wrap justify-center gap-1 mt-4">
                            ${shuffled.map(l => `<div class="w-10 h-10 bg-orange-400 text-white rounded flex items-center justify-center font-bold cursor-pointer shadow-md">${l.toUpperCase()}</div>`).join('')}
                        </div>
                    </div>
                `;
            }
        }

        function renderNav() {
            const nav = document.getElementById('step-nav');
            nav.innerHTML = items.map((_, i) => `<div class="step-pill ${i===curStep?'active':''}" id="pill-${i}">${i+1}</div>`).join('');
        }

        // Gestione Media
        function pickImg(k) { activeKey = key = k; document.getElementById('imgInp').click(); }
        function pickAud(k) { activeKey = k; document.getElementById('audInp').click(); }
        function saveImg(e) {
            const r = new FileReader();
            r.onload = (ev) => { dbImg[activeKey] = ev.target.result; loadStep(curStep); };
            r.readAsDataURL(e.target.files[0]);
        }
        function saveAud(e) {
            const r = new FileReader();
            r.onload = (ev) => { dbAud[activeKey] = ev.target.result; };
            r.readAsDataURL(e.target.files[0]);
        }
        function playAud(type) {
            const key = type === 'consigne' ? 'con-f' : activeKey;
            if(dbAud[key]) { new Audio(dbAud[key]).play(); }
            else { 
                const msg = new SpeechSynthesisUtterance(document.getElementById(key).value || items[curStep]);
                msg.lang = 'fr-FR'; window.speechSynthesis.speak(msg);
            }
        }
        function switchLevel(l) { curLvl = l; updatePreview(); }
    </script>
</body>
</html>
