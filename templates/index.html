<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur FLE Hachette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .h-unite { background-color: #1e3a8a; color: white; padding: 12px 20px; font-weight: bold; text-transform: uppercase; }
        .h-activite { background-color: #f1f5f9; color: #475569; padding: 10px 20px; font-weight: bold; border-bottom: 2px solid #e2e8f0; }
        .btn-lvl { padding: 6px 20px; border-radius: 999px; border: 2px solid #1e3a8a; color: #1e3a8a; font-weight: bold; }
        .btn-lvl.active { background-color: #1e3a8a; color: white; }
        .game-canvas { min-height: 400px; background: white; border: 1px solid #e2e8f0; }
        .input-label { font-size: 0.75rem; font-weight: bold; color: #1e3a8a; text-transform: uppercase; margin-bottom: 2px; display: block; }
    </style>
</head>
<body class="bg-slate-200 p-4">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div class="lg:w-1/3 bg-white p-5 rounded-lg shadow-xl space-y-4">
            <h2 class="text-xl font-bold text-blue-900 border-b pb-2">Configurazione</h2>
            
            <div>
                <label class="input-label">Unité (Numéro & Titre)</label>
                <input id="in-unite" type="text" class="w-full p-2 border rounded" placeholder="Ex: Unité 1 : La chambre">
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs bg-blue-50 p-3 rounded">
                <div class="col-span-2 font-bold border-b mb-2">Niveau Facile</div>
                <div class="col-span-2">
                    <label class="input-label">Consigne</label>
                    <input id="con-f" type="text" class="w-full p-2 border rounded text-xs">
                </div>
                <div>
                    <label class="input-label">Typologie</label>
                    <select id="type-f" class="w-full p-2 border rounded text-xs">
                        <option value="drag">Drag & Drop</option>
                        <option value="memory">Memory</option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2 text-xs bg-slate-50 p-3 rounded">
                <div class="col-span-2 font-bold border-b mb-2">Niveau Difficile</div>
                <div class="col-span-2">
                    <label class="input-label">Consigne</label>
                    <input id="con-d" type="text" class="w-full p-2 border rounded text-xs">
                </div>
                <div>
                    <label class="input-label">Typologie</label>
                    <select id="type-d" class="w-full p-2 border rounded text-xs">
                        <option value="anagramme">Anagramme</option>
                        <option value="croises">Mots Croisés</option>
                    </select>
                </div>
            </div>

            <div>
                <label class="input-label">Liste des Items (Séparés par ;)</label>
                <textarea id="items-list" class="w-full h-24 p-2 border rounded text-sm" placeholder="lit; armoire; lampe..."></textarea>
            </div>

            <button onclick="aggiornaAnteprima()" class="w-full bg-blue-700 text-white py-3 rounded font-bold hover:bg-blue-800 transition">AGGIORNA ANTEPRIMA</button>
        </div>

        <div class="lg:w-2/3">
            <div id="res-container" class="bg-white rounded-lg shadow-2xl overflow-hidden min-h-[600px]">
                <div id="res-unite" class="h-unite">UNITÉ</div>
                <div id="res-activite" class="h-activite">ACTIVITÉ</div>
                
                <div class="p-6">
                    <div class="flex gap-3 mb-6">
                        <button id="b-f" class="btn-lvl active" onclick="setLvl('f')">Niveau Facile</button>
                        <button id="b-d" class="btn-lvl" onclick="setLvl('d')">Niveau Difficile</button>
                    </div>
                    
                    <p id="res-consigne" class="italic text-slate-600 mb-6 text-lg"></p>
                    
                    <div id="game-area" class="game-canvas p-10 flex flex-wrap gap-4 justify-center items-center">
                        </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLevel = 'f';

        function aggiornaAnteprima() {
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('res-activite').innerText = "Activité"; 
            setLvl(currentLevel);
        }

        function setLvl(l) {
            currentLevel = l;
            document.getElementById('b-f').classList.toggle('active', l === 'f');
            document.getElementById('b-d').classList.toggle('active', l === 'd');
            
            const items = document.getElementById('items-list').value.split(';').filter(i => i.trim() !== "");
            const area = document.getElementById('game-area');
            
            if(l === 'f') {
                document.getElementById('res-consigne').innerText = document.getElementById('con-f').value || "Consigne facile";
                area.innerHTML = items.map(i => `<div class="border-2 border-blue-800 p-4 rounded bg-blue-50 font-bold">${i.trim()}</div>`).join('');
            } else {
                document.getElementById('res-consigne').innerText = document.getElementById('con-d').value || "Consigne difficile";
                area.innerHTML = items.map(i => `<div class="p-4 border rounded bg-slate-100 italic">? (Anagramme de ${i.trim()})</div>`).join('');
            }
        }
    </script>
</body>
</html>
