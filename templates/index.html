<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur FLE Hachette</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .h-1 { background-color: #2b469b; color: white; padding: 12px; font-weight: bold; text-transform: uppercase; font-size: 1.1rem; }
        .h-2 { background-color: #e2e8f0; color: #475569; padding: 10px; font-weight: bold; border-bottom: 2px solid #cbd5e1; }
        .btn-lvl { padding: 6px 20px; border-radius: 999px; border: 2px solid #2b469b; color: #2b469b; font-weight: bold; transition: 0.3s; }
        .btn-lvl.active { background-color: #2b469b; color: white; }
        .game-box { min-height: 350px; background: white; border: 1px solid #e2e8f0; border-radius: 0 0 8px 8px; }
        .domino { border: 2px solid #2b469b; padding: 15px; border-radius: 8px; display: inline-block; margin: 8px; background: #f8fafc; font-weight: 600; }
    </style>
</head>
<body class="bg-slate-100 p-4 md:p-10">

    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-8">
        <div class="md:w-1/3 bg-white p-6 rounded-xl shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-blue-900">⚙️ Configuration</h2>
            <textarea id="userInput" class="w-full h-80 p-4 border-2 border-slate-200 rounded-lg mb-4 focus:border-blue-500 outline-none transition" placeholder="Incolla qui le specifiche..."></textarea>
            <button onclick="genera()" id="btn-main" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-800 shadow-md active:scale-95 transition">GENERA ESERCIZIO</button>
        </div>

        <div class="md:w-2/3">
            <div id="preview" class="hidden shadow-2xl rounded-xl overflow-hidden bg-white">
                <div id="out-unite" class="h-1 text-center md:text-left"></div>
                <div id="out-titre" class="h-2 text-center md:text-left"></div>
                
                <div class="p-6">
                    <div class="flex gap-4 mb-6 justify-center md:justify-start">
                        <button id="btn-f" class="btn-lvl active" onclick="switchLvl('f')">Niveau Facile</button>
                        <button id="btn-d" class="btn-lvl" onclick="switchLvl('d')">Niveau Difficile</button>
                    </div>

                    <p id="out-consigne" class="text-slate-600 italic mb-6 text-lg"></p>
                    <div id="game-area" class="game-box p-8 flex flex-wrap justify-center items-center">
                        </div>
                </div>
            </div>
            
            <div id="loading" class="hidden flex flex-col items-center justify-center h-full space-y-4 py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600"></div>
                <p class="text-slate-500 font-medium">L'IA sta creando la risorsa...</p>
            </div>
        </div>
    </div>

    <script>
        let data = null;

        async function genera() {
            const txt = document.getElementById('userInput').value;
            if(!txt) return alert("Inserisci il testo!");
            
            document.getElementById('preview').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                const r = await fetch('/generate', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({testo: txt})
                });
                data = await r.json();
                
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('preview').classList.remove('hidden');
                
                document.getElementById('out-unite').innerText = data.unite || "Unité";
                document.getElementById('out-titre').innerText = data.titre_activite || "Activité";
                switchLvl('f');
            } catch (e) {
                alert("Errore nella generazione. Riprova.");
                document.getElementById('loading').classList.add('hidden');
            }
        }

        function switchLvl(l) {
            const area = document.getElementById('game-area');
            document.getElementById('btn-f').classList.toggle('active', l === 'f');
            document.getElementById('btn-d').classList.toggle('active', l === 'd');

            if(l === 'f') {
                document.getElementById('out-consigne').innerText = data.consigne_f;
                area.innerHTML = data.items.map(i => `<div class="domino">🖼️ | ${i}</div>`).join('');
            } else {
                document.getElementById('out-consigne').innerText = data.consigne_d;
                area.innerHTML = `<div class="grid grid-cols-2 gap-4">
                    ${data.items.slice(0,4).map(i => `<div class="border p-4 bg-slate-50 rounded"><strong>${i.toUpperCase()}</strong><br><span class="text-blue-500 text-2xl">?</span></div>`).join('')}
                </div>`;
            }
        }
    </script>
</body>
</html>
