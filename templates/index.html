<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loustics Authoring Tool - Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hfle-blue: #0169B3; --hfle-orange: #EFA92C; --hfle-success: #8dc549; --hfle-error: #d84157; }
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #f1f5f9; }
        .h-titre { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--hfle-blue); text-shadow: rgb(255, 255, 255) 4px 0px 0px, rgb(255, 255, 255) 3.8px 1px 0px; }
        .h-unite-bar { background-color: var(--hfle-blue); color: white; padding: 12px; text-transform: uppercase; font-weight: 700; text-align: center; }
        .step-pill { width: 35px; height: 35px; border-radius: 10px; background: #7CB5DD; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; }
        .step-pill.active { background-color: var(--hfle-blue); transform: scale(1.1); }
        .step-pill.completed { background-color: var(--hfle-success); }
        
        /* Game Components */
        .domino-tile { border: 3px solid var(--hfle-blue); border-radius: 12px; display: flex; background: white; height: 85px; width: 190px; cursor: grab; overflow: hidden; flex-shrink: 0; }
        .tile-img { width: 50%; background: #fff; display: flex; align-items: center; justify-content: center; border-right: 2px dashed var(--hfle-blue); position: relative; }
        .tile-img img { max-height: 85%; max-width: 85%; object-fit: contain; }
        .tile-text { width: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; text-align: center; padding: 4px; }
        .drop-target { width: 190px; height: 85px; border: 3px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-weight: bold; }
        .letter-tile { width: 40px; height: 40px; background: var(--hfle-orange); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: grab; }
        .rebus-gap { display: inline-block; width: 60px; height: 40px; border: 2px dashed var(--hfle-blue); border-radius: 8px; vertical-align: middle; margin: 0 5px; background: #f8fafc; }

        /* Mapper UI */
        #mapper-modal { background: rgba(0,0,0,0.85); z-index: 100; }
        .mapper-zone { position: absolute; border: 2px dashed var(--hfle-orange); background: rgba(239, 169, 44, 0.3); cursor: grab; }
        .resize-handle { position: absolute; right: -6px; bottom: -6px; width: 14px; height: 14px; background: var(--hfle-blue); border-radius: 50%; cursor: se-resize; }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="mapper-modal" class="fixed inset-0 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-5xl flex flex-col h-[90vh]">
            <div class="p-4 border-b flex justify-between items-center bg-blue-50">
                <h3 class="font-bold text-blue-900">🗺️ Visual Mapper - Dressing Game</h3>
                <button onclick="closeMapper()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold">Salva e Chiudi</button>
            </div>
            <div class="p-4 flex gap-4 bg-gray-50 border-b">
                <button onclick="pickImg('mapper_bg')" class="bg-white border-2 border-blue-200 px-4 py-2 rounded font-bold text-xs">1. Carica Sfondo</button>
                <button onclick="addZone()" class="bg-white border-2 border-orange-200 px-4 py-2 rounded font-bold text-xs text-orange-700">+ 2. Aggiungi Zona Incastro</button>
            </div>
            <div class="flex-grow overflow-auto p-10 bg-slate-300 flex justify-center">
                <div id="mapper-container" class="relative bg-white shadow-xl min-w-[500px] min-h-[500px]">
                    <img id="mapper-preview" src="" class="max-w-full pointer-events-none hidden">
                    <p id="mapper-hint" class="absolute inset-0 flex items-center justify-center text-gray-400 font-bold uppercase italic">Carica uno sfondo per iniziare</p>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-[1600px] mx-auto flex flex-col lg:flex-row gap-4">
        <div class="lg:w-1/3 bg-white p-5 rounded-xl shadow-lg border-t-8 border-blue-800 overflow-y-auto max-h-[95vh] text-xs">
            <h2 class="text-xl font-bold text-blue-900 mb-4 border-b pb-2 uppercase">Loustics Configurator</h2>
            
            <div class="space-y-6">
                <div class="grid grid-cols-2 gap-2">
                    <div><p class="font-bold uppercase mb-1">Unité</p><input id="in-unite" type="text" class="w-full p-2 border rounded" placeholder="UNITÉ 4"></div>
                    <div><p class="font-bold uppercase mb-1">Titre</p><input id="in-titre" type="text" class="w-full p-2 border rounded" placeholder="Le déguisement"></div>
                </div>

                <div id="levels-config" class="space-y-4">
                    <div class="p-4 bg-blue-50 rounded-xl border border-blue-200 space-y-3">
                        <p class="font-black text-blue-800 text-lg">FACILE</p>
                        <input id="con-f" type="text" class="w-full p-2 border rounded" value="Écoute e choisis la bonne image.">
                        <select id="type-f" class="type-sel w-full p-2 border rounded bg-white font-bold" onchange="toggleMapperBtn('f')"></select>
                        <div class="flex gap-2">
                            <button onclick="pickAud('aud-f')" class="flex-1 bg-white border p-2 rounded shadow-sm hover:bg-gray-50">🎵 Audio</button>
                            <button id="btn-map-f" onclick="openMapper()" class="flex-1 bg-orange-100 border border-orange-300 p-2 rounded shadow-sm font-bold hidden">🗺️ Mapper</button>
                        </div>
                    </div>

                    <div class="p-4 bg-orange-50 rounded-xl border border-orange-200 space-y-3">
                        <p class="font-black text-orange-800 text-lg">DIFFICILE</p>
                        <input id="con-d" type="text" class="w-full p-2 border rounded" value="Remets les lettres en ordre.">
                        <select id="type-d" class="type-sel w-full p-2 border rounded bg-white font-bold" onchange="toggleMapperBtn('d')"></select>
                        <div class="flex gap-2">
                            <button onclick="pickAud('aud-d')" class="flex-1 bg-white border p-2 rounded shadow-sm hover:bg-gray-50">🎵 Audio</button>
                            <button id="btn-map-d" onclick="openMapper()" class="flex-1 bg-orange-100 border border-orange-300 p-2 rounded shadow-sm font-bold hidden">🗺️ Mapper</button>
                        </div>
                    </div>
                </div>

                <div>
                    <p class="font-bold uppercase mb-1">Data (separati da ;)</p>
                    <textarea id="items-list" class="w-full h-24 p-2 border rounded" placeholder="armoire; couette; lampe"></textarea>
                    <p class="text-[9px] text-gray-500 italic mt-1">Per il Rebus usa: {item} nel testo.</p>
                </div>
            </div>
            <button onclick="initGame()" class="w-full mt-6 bg-blue-700 text-white py-4 rounded-xl font-black text-sm shadow-xl hover:bg-blue-800 transition">🚀 GENERA ATTIVITÀ</button>
        </div>

        <div class="lg:w-2/3 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[700px] relative">
            <div id="res-unite" class="h-unite-bar">UNITÉ</div>
            <div class="px-6 py-4 flex justify-between items-center border-b">
                <h1 id="res-titre" class="h-titre text-2xl md:text-3xl uppercase">TITRE</h1>
                <div class="flex gap-2">
                    <button id="btn-f-view" onclick="switchLvl('f')" class="px-5 py-1 rounded-full text-xs font-black border-2 border-blue-900 bg-blue-900 text-white">FACILE</button>
                    <button id="btn-d-view" onclick="switchLvl('d')" class="px-5 py-1 rounded-full text-xs font-black border-2 border-blue-900 text-blue-900">DIFFICILE</button>
                </div>
            </div>

            <div class="p-8 flex-grow flex flex-col items-center">
                <div class="flex items-center gap-3 mb-10 bg-slate-50 px-8 py-3 rounded-full border border-slate-200 shadow-sm">
                    <p id="res-consigne" class="italic text-gray-700 font-bold text-lg"></p>
                    <button onclick="playConsigne()" class="text-blue-600 text-2xl hover:scale-125 transition">🔊</button>
                </div>

                <div id="main-content" class="w-full flex flex-col items-center gap-10"></div>
                
                <div id="pool" class="mt-auto p-6 w-full flex flex-wrap justify-center gap-6 border-t border-dashed border-slate-200"></div>
            </div>

            <div id="nav-step" class="p-5 bg-slate-50 border-t flex justify-center gap-3 flex-wrap"></div>
        </div>
    </div>

    <input type="file" id="imgInp" class="hidden" accept="image/*" onchange="handleImg(event)">
    <input type="file" id="audInp" class="hidden" accept="audio/*" onchange="handleAud(event)">

    <script>
        const types = [
            {id: 'domino', n: 'Domino Chain'},
            {id: 'anagramme', n: 'Anagramme (Ordering)'},
            {id: 'dressing', n: 'Dressing Game (Mapper)'},
            {id: 'rebus', n: 'Texte à trous (Rebus)'},
            {id: 'crossword', n: 'Mots Croisés'}
        ];

        let items = [], dbImg = {}, dbAud = {}, curStep = 0, curLvl = 'f', status = [], activeKey = "";
        let mappedZones = [];

        // Popola select
        document.querySelectorAll('.type-sel').forEach(s => s.innerHTML = types.map(t=>`<option value="${t.id}">${t.n}</option>`).join(''));

        function toggleMapperBtn(l) {
            document.getElementById(`btn-map-${l}`).classList.toggle('hidden', document.getElementById(`type-${l}`).value !== 'dressing');
        }

        function openMapper() { document.getElementById('mapper-modal').classList.remove('hidden'); }
        function closeMapper() { document.getElementById('mapper-modal').classList.add('hidden'); initGame(); }

        function initGame() {
            items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i);
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('res-titre').innerText = document.getElementById('in-titre').value || "ACTIVITÉ";
            status = new Array(items.length).fill('pending');
            loadStep(0);
        }

        function loadStep(idx) {
            if(items.length === 0) return;
            curStep = idx; renderNav();
            const stage = document.getElementById('main-content');
            const pool = document.getElementById('pool');
            const word = items[idx];
            const type = curLvl === 'f' ? document.getElementById('type-f').value : document.getElementById('type-d').value;
            document.getElementById('res-consigne').innerText = curLvl === 'f' ? document.getElementById('con-f').value : document.getElementById('con-d').value;

            if(type === 'dressing') {
                const bg = dbImg['mapper_bg'] ? `<img src="${dbImg['mapper_bg']}" class="max-h-full">` : `<div class="p-10 text-gray-400">Carica Sfondo nel Mapper</div>`;
                const zone = mappedZones.find(z => z.word.toLowerCase() === word.toLowerCase());
                // Rimosso il bg visibile se non necessario, ma utile per il debug
                const targetHtml = zone ? `<div id="target" class="absolute border-2 border-dashed border-blue-500 bg-blue-100/30 rounded-lg flex items-center justify-center transition-all duration-300" style="left:${zone.left}; top:${zone.top}; width:${zone.width}; height:${zone.height}"></div>` : '';
                
                stage.innerHTML = `<div class="relative w-[400px] h-[400px] bg-slate-50 border-4 border-white shadow-xl rounded-2xl flex items-center justify-center overflow-hidden">${bg}${targetHtml}</div>`;
                pool.innerHTML = items.map(it => `<div class="w-20 h-20 bg-white border-2 border-blue-200 rounded-lg shadow-md cursor-grab p-1 flex items-center justify-center transition-all" data-word="${it}" onclick="pickImg('${it}')">${dbImg[it]?`<img src="${dbImg[it]}" class="max-h-full object-contain pointer-events-none">`:`<span class="text-[7px]">📷 ${it}</span>`}</div>`).join('');
                setupSortable('dressing', word);
            }
            else if(type === 'domino') {
                stage.innerHTML = `<div class="flex items-center gap-6"><div class="domino-tile opacity-40"><div class="tile-img">?</div><div class="tile-text">${word}</div></div><div class="text-3xl text-blue-300">➜</div><div id="target" class="drop-target">DROP</div></div>`;
                pool.innerHTML = items.map((it, i) => {
                    const imgNeeded = i === 0 ? items[items.length-1] : items[i-1];
                    return `<div class="domino-tile shadow-lg" data-word="${it}"><div class="tile-img" onclick="pickImg('${imgNeeded}')">${dbImg[imgNeeded]?`<img src="${dbImg[imgNeeded]}" class="object-contain w-full h-full">`:`📷 ${imgNeeded}`}</div><div class="tile-text">${it}</div></div>`;
                }).join('');
                setupSortable('domino', word);
            }
            else if(type === 'rebus') {
                const text = items[idx].replace(/{([^}]+)}/g, `<div id="target" class="rebus-gap overflow-hidden flex items-center justify-center" data-ans="$1"></div>`);
                stage.innerHTML = `<div class="text-2xl font-bold text-blue-900 leading-loose">${text}</div>`;
                pool.innerHTML = items.map(it => `<div class="px-4 py-2 bg-white border-2 border-blue-400 rounded-full shadow-sm cursor-grab font-bold text-sm flex items-center justify-center" data-word="${it}">${it}</div>`).join('');
                setupSortable('rebus', word);
            }
            // ... (altre tipologie)
        }

        function setupSortable(mode, targetWord) {
            const pool = document.getElementById('pool');
            const target = document.getElementById('target');
            if(!target || !pool) return;

            new Sortable(pool, { group: 'game', sort: false, animation: 150 });
            new Sortable(target, { 
                group: 'game', 
                animation: 150,
                onAdd: (e) => {
                    const dropped = e.item.getAttribute('data-word') || e.item.getAttribute('data-letter');
                    
                    if(mode === 'dressing') {
                        if(dropped.toLowerCase() === targetWord.toLowerCase()) {
                            // ADATTAMENTO AL 100% DELL'AREA:
                            e.item.className = "w-full h-full flex items-center justify-center p-0 m-0 border-0 bg-transparent shadow-none";
                            
                            // Adatta l'immagine interna
                            const img = e.item.querySelector('img');
                            if(img) img.className = "w-full h-full object-contain pointer-events-none";

                            // Nascondi i tratteggi del target
                            e.target.style.border = "none";
                            e.target.style.backgroundColor = "transparent";

                            validate(true);
                        } else { alert("Riprova!"); e.item.remove(); validate(false); }
                    }
                    else if(mode === 'domino') {
                        const nextItem = items[curStep + 1] || items[0];
                        if(dropped === nextItem) validate(true);
                        else { alert("Riprova!"); e.item.remove(); validate(false); }
                    }
                    else if(mode === 'rebus') {
                        // Semplificazione validazione rebus
                        e.item.className = "w-full h-full flex items-center justify-center text-sm font-bold bg-transparent border-none shadow-none text-blue-900 m-0 p-0";
                        e.target.style.border = "none";
                        validate(true);
                    }
                }
            });
        }

        function validate(correct) {
            if(correct) { 
                confetti(); status[curStep]='completed'; 
                if(dbAud['global_ok']) new Audio(dbAud['global_ok']).play();
                setTimeout(()=>loadStep(curStep < items.length-1 ? curStep+1 : 0), 1500); 
            }
            else {
                status[curStep]='error';
                if(dbAud['global_ko']) new Audio(dbAud['global_ko']).play();
            }
            renderNav();
        }

        function renderNav() { document.getElementById('nav-step').innerHTML = items.map((_, i) => `<div class="step-pill ${i===curStep?'active':''} ${status[i]}" onclick="loadStep(${i})">${i+1}</div>`).join(''); }

        function switchLvl(l) { 
            curLvl = l; 
            document.getElementById('btn-f-view').className = l==='f' ? 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-900 bg-blue-900 text-white shadow-md' : 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-900 text-blue-900';
            document.getElementById('btn-d-view').className = l==='d' ? 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-900 bg-blue-900 text-white shadow-md' : 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-900 text-blue-900';
            initGame();
        }

        function pickImg(k) { activeKey = k; document.getElementById('imgInp').click(); }
        function pickAud(k) { activeKey = k; document.getElementById('audInp').click(); }
        
        function handleImg(e) { 
            const r = new FileReader(); r.onload=(ev)=>{ 
                dbImg[activeKey]=ev.target.result; 
                if(activeKey==='mapper_bg'){ 
                    document.getElementById('mapper-preview').src=ev.target.result; 
                    document.getElementById('mapper-preview').classList.remove('hidden'); 
                    document.getElementById('mapper-hint').classList.add('hidden'); 
                }
                loadStep(curStep); 
            }; r.readAsDataURL(e.target.files[0]); 
        }
        
        function handleAud(e) { const r = new FileReader(); r.onload=(ev)=>{dbAud[activeKey]=ev.target.result; alert("Audio MP3 salvato in memoria!");}; r.readAsDataURL(e.target.files[0]); }
        
        /* --- VISUAL MAPPER LOGIC --- */
        function addZone() {
            const z = document.createElement('div'); z.className = 'mapper-zone';
            z.style.cssText = "width:20%; height:20%; left:40%; top:40%;";
            const word = items[mappedZones.length] || "item";
            z.innerHTML = `<input class="w-16 text-[8px] font-bold text-center border-none bg-white/80" value="${word}" onchange="this.parentElement.dataset.word=this.value"><div class="resize-handle"></div>`;
            z.dataset.word = word;
            document.getElementById('mapper-container').appendChild(z);
            makeDraggable(z);
        }

        function makeDraggable(el) {
            let container = document.getElementById('mapper-container');
            el.onmousedown = (e) => {
                if(e.target.tagName === 'INPUT' || e.target.classList.contains('resize-handle')) return;
                let sx = e.clientX, sy = e.clientY;
                document.onmousemove = (ev) => {
                    let dx = ev.clientX-sx, dy = ev.clientY-sy; sx=ev.clientX; sy=ev.clientY;
                    el.style.left = (el.offsetLeft + dx)/container.offsetWidth*100 + '%';
                    el.style.top = (el.offsetTop + dy)/container.offsetHeight*100 + '%';
                };
                document.onmouseup = () => { document.onmousemove = null; saveZones(); };
            };
            el.querySelector('.resize-handle').onmousedown = (e) => {
                e.stopPropagation();
                document.onmousemove = (ev) => {
                    el.style.width = (ev.clientX - el.getBoundingClientRect().left)/container.offsetWidth*100 + '%';
                    el.style.height = (ev.clientY - el.getBoundingClientRect().top)/container.offsetHeight*100 + '%';
                };
                document.onmouseup = () => { document.onmousemove = null; saveZones(); };
            };
        }

        function saveZones() {
            mappedZones = Array.from(document.querySelectorAll('.mapper-zone')).map(z => ({
                word: z.dataset.word, left: z.style.left, top: z.style.top, width: z.style.width, height: z.style.height
            }));
        }

        function playConsigne() {
            const key = curLvl === 'f' ? 'aud-f' : 'aud-d';
            if(dbAud[key]) {
                const a = new Audio(dbAud[key]);
                a.play().catch(e => console.error(e));
            } else { 
                const m = new SpeechSynthesisUtterance(document.getElementById(`con-${curLvl}`).value); 
                m.lang='fr-FR'; window.speechSynthesis.speak(m); 
            }
        }
    </script>
</body>
</html>
