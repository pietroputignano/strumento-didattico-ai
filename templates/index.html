<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur FLE</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hachette-header-1 { background-color: #1e40af; color: white; padding: 10px; font-weight: bold; text-transform: uppercase; }
        .hachette-header-2 { background-color: #e5e7eb; color: #374151; padding: 8px; font-weight: bold; border-bottom: 2px solid #d1d5db; }
        .btn-level { padding: 5px 15px; border-radius: 20px; border: 2px solid #1e40af; color: #1e40af; font-weight: bold; cursor: pointer; }
        .btn-level.active { background-color: #1e40af; color: white; }
        .game-canvas { min-height: 300px; background: white; border: 1px solid #ddd; position: relative; overflow: hidden; }
        .domino-item { border: 2px solid #333; padding: 10px; display: inline-block; margin: 5px; background: #fff; cursor: grab; }
    </style>
</head>
<body class="bg-slate-50">

    <div class="flex h-screen">
        <div class="w-1/3 p-6 bg-white border-r shadow-lg overflow-y-auto">
            <h2 class="text-xl font-bold mb-4 text-blue-800">⚙️ Configurazione</h2>
            <textarea id="userInput" class="w-full h-80 p-4 border rounded-lg mb-4 text-sm" placeholder="Incolla qui le specifiche dell'unità..."></textarea>
            <button onclick="genera()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700">GENERA ESERCIZIO</button>
        </div>

        <div class="w-2/3 p-6">
            <div id="preview-container" class="bg-white shadow-2xl rounded-lg overflow-hidden hidden">
                <div id="out-unite" class="hachette-header-1"></div>
                <div id="out-titre" class="hachette-header-2"></div>
                
                <div class="p-4 flex gap-4 border-b">
                    <button id="btn-f" class="btn-level active" onclick="switchLevel('facile')">Niveau Facile</button>
                    <button id="btn-d" class="btn-level" onclick="switchLevel('difficile')">Niveau Difficile</button>
                </div>

                <div class="p-6">
                    <p id="out-consigne" class="italic mb-4 text-gray-700"></p>
                    <div id="game-area" class="game-canvas p-4">
                        </div>
                </div>
            </div>
            
            <div id="placeholder" class="h-full flex items-center justify-center text-gray-400 border-4 border-dashed rounded-xl">
                L'anteprima si caricherà qui...
            </div>
        </div>
    </div>

    <script>
        let currentData = null;

        async function genera() {
            const testo = document.getElementById('userInput').value;
            const resp = await fetch('/generate', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({testo: testo})
            });
            currentData = await resp.json();
            mostraEsercizio();
        }

        function mostraEsercizio() {
            document.getElementById('placeholder').classList.add('hidden');
            document.getElementById('preview-container').classList.remove('hidden');
            document.getElementById('out-unite').innerText = currentData.unite;
            document.getElementById('out-titre').innerText = currentData.titre_activite;
            switchLevel('facile');
        }

        function switchLevel(lvl) {
            const btnF = document.getElementById('btn-f');
            const btnD = document.getElementById('btn-d');
            const area = document.getElementById('game-area');
            
            if(lvl === 'facile') {
                btnF.classList.add('active'); btnD.classList.remove('active');
                document.getElementById('out-consigne').innerText = currentData.livello_facile.consigne;
                area.innerHTML = currentData.items.map(i => `<div class="domino-item">🖼️ | ${i}</div>`).join('');
            } else {
                btnD.classList.add('active'); btnF.classList.remove('active');
                document.getElementById('out-consigne').innerText = currentData.livello_difficile.consigne;
                area.innerHTML = `<div class="text-center p-10 border-2 border-orange-200 bg-orange-50">
                    <p class="mb-4">Clicca sul punto di domanda per riordinare le lettere:</p>
                    <div class="text-3xl font-bold">?</div>
                </div>`;
            }
        }
    </script>
</body>
</html>
