<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Générateur FLE - Hachette Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f1f5f9; }
        .h-unite { background-color: #1e3a8a; color: white; padding: 15px; font-weight: bold; text-transform: uppercase; text-align: center; }
        .h-activite { background-color: #f8fafc; color: #475569; padding: 10px 20px; font-weight: bold; border-bottom: 2px solid #e2e8f0; }
        
        /* Step Pills */
        .step-pill { 
            width: 32px; height: 32px; border-radius: 50%; 
            display: flex; align-items: center; justify-content: center; 
            font-size: 12px; font-weight: bold; cursor: pointer;
            transition: 0.3s; border: 2px solid #cbd5e1; background: white; color: #94a3b8;
        }
        .step-pill:hover { transform: scale(1.1); border-color: #1e3a8a; }
        .step-pill.active { border-color: #1e3a8a; color: #1e3a8a; background: #eff6ff; box-shadow: 0 0 10px rgba(30, 58, 138, 0.2); }
        .step-pill.completed { background-color: #10b981 !important; border-color: #10b981 !important; color: white !important; }

        /* Domino & Game Elements */
        .domino-tile { border: 3px solid #1e3a8a; border-radius: 12px; display: flex; background: white; overflow: hidden; height: 80px; width: 180px; cursor: grab; }
        .tile-img { width: 50%; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #1e3a8a; background: #fff; }
        .tile-img img { max-height: 85%; max-width: 85%; object-fit: contain; }
        .tile-text { width: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; text-align: center; padding: 4px; }
        .drop-target { width: 180px; height: 80px; border: 3px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-weight: bold; }
        .letter-tile { width: 42px; height: 42px; background: #efa92c; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #c78a1e; }
    </style>
</head>
<body class="p-2 md:p-6">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div class="lg:w-1/3 bg-white p-5 rounded-xl shadow-lg space-y-4 overflow-y-auto max-h-[90vh]">
            <h2 class="text-xl font-bold text-blue-900 border-b pb-2 uppercase italic">Configurazione</h2>
            
            <div class="space-y-4 text-sm">
                <div><p class="font-bold mb-1 uppercase text-xs">Unité</p><input id="in-unite" type="text" class="w-full p-2 border rounded" placeholder="Unité 1"></div>
                <div><p class="font-bold mb-1 uppercase text-xs">Titre Activité</p><input id="in-activite" type="text" class="w-full p-2 border rounded" placeholder="Le domino"></div>

                <div class="p-3 bg-blue-50 rounded-lg border border-blue-100">
                    <p class="font-bold text-xs text-blue-800 uppercase mb-2">Niveau Facile</p>
                    <input id="con-f" type="text" class="w-full p-2 border rounded mb-2 text-xs" value="Relie les dominos.">
                    <button onclick="pickAud('con-f')" class="text-[10px] bg-white border px-2 py-1 rounded shadow-sm">🎵 Carica Audio</button>
                </div>

                <div class="p-3 bg-orange-50 rounded-lg border border-orange-100">
                    <p class="font-bold text-xs text-orange-800 uppercase mb-2">Niveau Difficile</p>
                    <input id="con-d" type="text" class="w-full p-2 border rounded mb-2 text-xs" value="Remets en ordre.">
                    <button onclick="pickAud('con-d')" class="text-[10px] bg-white border px-2 py-1 rounded shadow-sm">🎵 Carica Audio</button>
                </div>

                <div><p class="font-bold mb-1">Mots (séparés par ;)</p><textarea id="items-list" class="w-full h-24 p-2 border rounded text-xs" placeholder="lit; armoire; tapis"></textarea></div>
            </div>

            <button onclick="updatePreview()" class="w-full bg-blue-700 text-white py-3 rounded-lg font-bold shadow-md hover:bg-blue-800 transition">👁️ AGGIORNA ANTEPRIMA</button>
        </div>

        <div class="lg:w-2/3 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[580px]">
            <div id="res-unite" class="h-unite">UNITÉ</div>
            <div class="h-activite flex justify-between items-center">
                <span id="txt-activite">ACTIVITÉ</span>
                <div class="flex gap-1">
                    <button id="btn-f" onclick="switchLevel('f')" class="px-3 py-1 rounded-full text-[10px] font-bold border-2 border-blue-800 bg-blue-800 text-white">FACILE</button>
                    <button id="btn-d" onclick="switchLevel('d')" class="px-3 py-1 rounded-full text-[10px] font-bold border-2 border-blue-800 text-blue-800">DIFFICILE</button>
                </div>
            </div>

            <div class="p-6 flex-grow flex flex-col items-center">
                <div class="flex items-center gap-3 mb-6">
                    <p id="res-consigne" class="italic text-gray-600 font-medium"></p>
                    <button onclick="playAud('consigne')" class="text-blue-600 text-xl transition active:scale-125">🔊</button>
                </div>
                
                <div id="game-stage" class="w-full flex flex-col items-center gap-6"></div>
                <div id="options-pool" class="mt-8 flex flex-wrap justify-center gap-3 w-full"></div>
            </div>

            <div id="step-nav" class="p-4 bg-slate-50 border-t flex justify-center gap-2 flex-wrap"></div>
        </div>
    </div>

    <input type="file" id="imgInp" class="hidden" accept="image/*" onchange="saveImg(event)">
    <input type="file" id="audInp" class="hidden" accept="audio/*" onchange="saveAud(event)">

    <script>
        let items = [];
        let curLvl = 'f', curStep = 0;
        let dbImg = {}, dbAud = {}, stepStatus = []; // stepStatus terrà traccia di 'completed'
        let activeKey = "";

        function updatePreview() {
            items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i!=="");
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('txt-activite').innerText = document.getElementById('in-activite').value || "ACTIVITÉ";
            // Inizializza lo stato degli step come non completati
            stepStatus = new Array(items.length).fill(false);
            if(items.length > 0) loadStep(0);
        }

        function loadStep(idx) {
            curStep = idx;
            renderNav();
            const stage = document.getElementById('game-stage');
            const pool = document.getElementById('options-pool');
            const word = items[idx];
            
            if(curLvl === 'f') {
                document.getElementById('res-consigne').innerText = document.getElementById('con-f').value;
                stage.innerHTML = `
                    <div class="flex flex-col md:flex-row items-center gap-4">
                        <div class="domino-tile opacity-50 bg-slate-50"><div class="tile-img">?</div><div class="tile-text">${word}</div></div>
                        <div class="text-2xl text-blue-300 rotate-90 md:rotate-0">➜</div>
                        <div id="drop-zone" class="drop-target">TRASCINA QUI</div>
                    </div>
                `;
                pool.innerHTML = items.map(it => `
                    <div class="domino-tile shadow-md" data-word="${it}">
                        <div class="tile-img" onclick="pickImg('${it}')">${dbImg[it]?`<img src="${dbImg[it]}">`:'📷'}</div>
                        <div class="tile-text">${it}</div>
                    </div>
                `).join('');
                new Sortable(pool, { group: { name:'domino', pull:'clone', put:false }, sort:false });
                new Sortable(document.getElementById('drop-zone'), { 
                    group: 'domino', 
                    onAdd: function(evt) {
                        const dragged = evt.item.getAttribute('data-word');
                        if(dragged === (items[curStep + 1] || items[0])) {
                            completeStep();
                        } else { alert("Riprova!"); evt.item.remove(); }
                    }
                });
            } else {
                document.getElementById('res-consigne').innerText = document.getElementById('con-d').value;
                pool.innerHTML = "";
                const shuffled = word.split('').sort(()=>Math.random()-0.5);
                stage.innerHTML = `
                    <div class="flex flex-col items-center gap-6">
                        <div class="w-32 h-32 border-4 border-blue-900 rounded-xl overflow-hidden bg-white shadow-lg" onclick="pickImg('${word}')">
                            ${dbImg[word]?`<img src="${dbImg[word]}" class="w-full h-full object-contain">`:'📷'}
                        </div>
                        <div class="flex gap-2" onclick="completeStep()" style="cursor:pointer">
                            <p class="text-xs text-gray-400">(Simulazione: clicca qui per validare l'anagramma)</p>
                        </div>
                    </div>
                `;
            }
        }

        function completeStep() {
            confetti();
            stepStatus[curStep] = true; // Segna come completato
            renderNav();
            setTimeout(() => {
                if(curStep < items.length - 1) loadStep(curStep + 1);
                else alert("BRAVO ! HAI FINITO !");
            }, 1000);
        }

        function renderNav() {
            const nav = document.getElementById('step-nav');
            nav.innerHTML = items.map((_, i) => {
                let classes = "step-pill";
                if(i === curStep) classes += " active";
                if(stepStatus[i]) classes += " completed";
                return `<div class="${classes}" onclick="loadStep(${i})">${i+1}</div>`;
            }).join('');
        }

        function playAud(type) {
            const key = type === 'consigne' ? (curLvl === 'f' ? 'con-f' : 'con-d') : items[curStep];
            if(dbAud[key]) { new Audio(dbAud[key]).play(); }
            else { 
                const msg = new SpeechSynthesisUtterance(type === 'consigne' ? document.getElementById(key).value : items[curStep]);
                msg.lang = 'fr-FR'; window.speechSynthesis.speak(msg);
            }
        }

        function pickImg(k) { activeKey = k; document.getElementById('imgInp').click(); }
        function pickAud(k) { activeKey = k; document.getElementById('audInp').click(); }
        function saveImg(e) {
            const r = new FileReader();
            r.onload = (ev) => { dbImg[activeKey] = ev.target.result; loadStep(curStep); };
            r.readAsDataURL(e.target.files[0]);
        }
        function saveAud(e) {
            const r = new FileReader();
            r.onload = (ev) => { dbAud[activeKey] = ev.target.result; alert("Audio salvato!"); };
            r.readAsDataURL(e.target.files[0]);
        }
        function switchLevel(l) { 
            curLvl = l; 
            document.getElementById('btn-f').className = l==='f' ? 'px-3 py-1 rounded-full text-[10px] font-bold border-2 border-blue-800 bg-blue-800 text-white' : 'px-3 py-1 rounded-full text-[10px] font-bold border-2 border-blue-800 text-blue-800';
            document.getElementById('btn-d').className = l==='d' ? 'px-3 py-1 rounded-full text-[10px] font-bold border-2 border-blue-800 bg-blue-800 text-white' : 'px-3 py-1 rounded-full text-[10px] font-bold border-2 border-blue-800 text-blue-800';
            updatePreview(); 
        }
    </script>
</body>
</html>
