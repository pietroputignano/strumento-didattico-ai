<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bSmart – Jeux Interactifs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hfle-blue: #0169B3; --hfle-orange: #EFA92C; --hfle-success: #8dc549; --hfle-error: #d84157; }
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #f1f5f9; }
        .h-titre { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--hfle-blue); text-shadow: rgb(255, 255, 255) 4px 0px 0px, rgb(255, 255, 255) 3.8px 1px 0px; }
        .h-unite-bar { background-color: var(--hfle-blue); color: white; padding: 12px; text-transform: uppercase; font-weight: 700; text-align: center; }
        .step-pill { width: 35px; height: 35px; border-radius: 10px; background: #7CB5DD; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; }
        .step-pill.active { background-color: var(--hfle-blue); transform: scale(1.1); }
        .step-pill.completed { background-color: var(--hfle-success); }
        .domino-tile { border: 3px solid var(--hfle-blue); border-radius: 12px; display: flex; background: white; overflow: hidden; height: 85px; width: 190px; cursor: grab; flex-shrink: 0; }
        .tile-img { width: 50%; background: #fff; display: flex; align-items: center; justify-content: center; border-right: 2px dashed var(--hfle-blue); overflow: hidden; position: relative; }
        .tile-img img { max-height: 85%; max-width: 85%; object-fit: contain; }
        .tile-text { width: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 11px; text-align: center; padding: 4px; }
        .drop-target { width: 190px; height: 85px; border: 3px dashed #cbd5e1; border-radius: 12px; display: flex; align-items: center; justify-content: center; color: #cbd5e1; font-weight: bold; }
        .letter-tile { width: 42px; height: 42px; background: var(--hfle-orange); color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; box-shadow: 0 4px 0 #c78a1e; }
    </style>
</head>
<body class="p-2 md:p-4">

    <div class="max-w-[1500px] mx-auto flex flex-col lg:flex-row gap-4">
        <div class="lg:w-1/3 bg-white p-5 rounded-xl shadow-lg border-t-8 border-blue-800 overflow-y-auto max-h-[95vh] text-xs">
            <h2 class="text-xl font-bold text-blue-900 mb-4 uppercase italic border-b pb-2 text-center">Configurazione</h2>
            
            <div class="space-y-4">
                <div><p class="font-bold uppercase mb-1">Unité & Titolo</p>
                    <input id="in-unite" type="text" class="w-full p-2 border rounded mb-1" placeholder="UNITÉ 1">
                    <input id="in-titre" type="text" class="w-full p-2 border rounded" placeholder="Titre de l'activité">
                </div>

                <div class="p-3 bg-blue-50 rounded-lg border border-blue-200 space-y-2">
                    <p class="font-bold text-blue-800 uppercase">Niveau Facile</p>
                    <div>
                        <p class="font-bold text-[10px] mb-1">Consigne Facile</p>
                        <input id="con-f" type="text" class="w-full p-2 border rounded mb-2" value="Lis et déplace les dominos.">
                        <p class="font-bold text-[10px] mb-1">Tipologia</p>
                        <select id="type-f" class="w-full p-2 border rounded bg-white">
                            <option value="domino">Domino Chain</option>
                            <option value="anagramme">Anagramme</option>
                        </select>
                        <button onclick="pickAud('con-f')" class="mt-2 bg-white border p-1 rounded w-full shadow-sm hover:bg-gray-50">🎵 Carica Audio Consegna Facile</button>
                    </div>
                </div>

                <div class="p-3 bg-orange-50 rounded-lg border border-orange-200 space-y-2">
                    <p class="font-bold text-orange-800 uppercase">Niveau Difficile</p>
                    <div>
                        <p class="font-bold text-[10px] mb-1">Consigne Difficile</p>
                        <input id="con-d" type="text" class="w-full p-2 border rounded mb-2" value="Remets le mot dans l'ordre.">
                        <p class="font-bold text-[10px] mb-1">Tipologia</p>
                        <select id="type-d" class="w-full p-2 border rounded bg-white">
                            <option value="anagramme">Anagramme</option>
                            <option value="domino">Domino Chain</option>
                        </select>
                        <button onclick="pickAud('con-d')" class="mt-2 bg-white border p-1 rounded w-full shadow-sm hover:bg-gray-50">🎵 Carica Audio Consegna Difficile</button>
                    </div>
                </div>

                <div>
                    <p class="font-bold uppercase mb-1">Mots (item1; item2; ...)</p>
                    <textarea id="items-list" class="w-full h-24 p-2 border rounded" placeholder="armoire; couette; fenêtre; lampe"></textarea>
                </div>
            </div>
            <button onclick="initGame()" class="w-full mt-4 bg-blue-700 text-white py-3 rounded-lg font-bold">🚀 AGGIORNA ANTEPRIMA</button>
            <button onclick="downloadGame()" class="w-full bg-green-600 text-white py-2 rounded-lg font-bold text-sm">💾 SCARICA HTML</button>
        </div>

        <div class="lg:w-2/3 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[660px] relative">
            <div id="res-unite" class="h-unite-bar">UNITÉ 1</div>
            <div class="px-6 py-4 flex justify-between items-center border-b">
                <h1 id="res-titre" class="h-titre text-2xl uppercase">TITRE</h1>
                <div class="flex gap-1">
                    <button id="btn-f" onclick="switchLvl('f')" class="px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white shadow-md">FACILE</button>
                    <button id="btn-d" onclick="switchLvl('d')" class="px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800 shadow-md">DIFFICILE</button>
                </div>
            </div>

            <div class="p-6 flex-grow flex flex-col items-center">
                <div class="flex items-center gap-3 mb-8 bg-slate-50 px-6 py-2 rounded-full border">
                    <p id="res-consigne" class="italic text-gray-700 font-semibold"></p>
                    <button onclick="playConsigne()" class="text-blue-600 text-2xl hover:scale-125 transition">🔊</button>
                </div>
                <div id="main-content" class="w-full flex flex-col items-center gap-8"></div>
                <div id="pool" class="mt-auto p-4 w-full flex flex-wrap justify-center gap-4 border-t border-dashed border-slate-200"></div>
            </div>

            <div id="nav-step" class="p-4 bg-slate-50 border-t flex justify-center gap-2 flex-wrap"></div>
        </div>
    </div>

    <input type="file" id="imgInp" class="hidden" accept="image/*" onchange="handleImg(event)">
    <input type="file" id="audInp" class="hidden" accept="audio/*" onchange="handleAud(event)">

    <script>
        let items = [], dbImg = {}, dbAud = {}, curStep = 0, curLvl = 'f', status = [], activeKey = "";

        function initGame() {
            items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i);
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('res-titre').innerText = document.getElementById('in-titre').value || "ACTIVITÉ";
            status = new Array(items.length).fill('pending');
            loadStep(0);
        }

        function loadStep(idx) {
            curStep = idx; renderNav();
            const stage = document.getElementById('main-content');
            const pool = document.getElementById('pool');
            const word = items[idx];
            const type = curLvl === 'f' ? document.getElementById('type-f').value : document.getElementById('type-d').value;
            const consigne = curLvl === 'f' ? document.getElementById('con-f').value : document.getElementById('con-d').value;
            
            document.getElementById('res-consigne').innerText = consigne;

            if(type === 'domino') {
                stage.innerHTML = `<div class="flex items-center gap-6">
                    <div class="domino-tile opacity-40 bg-slate-50"><div class="tile-img">?</div><div class="tile-text">${word}</div></div>
                    <div class="text-3xl text-blue-300">➜</div><div id="target" class="drop-target">TRASCINA QUI</div>
                </div>`;
                
                pool.innerHTML = items.map((it, i) => {
                    const imgNeeded = i === 0 ? items[items.length - 1] : items[i - 1]; 
                    return `<div class="domino-tile shadow-md" data-word="${it}">
                        <div class="tile-img" onclick="pickImg('${imgNeeded}')">
                            ${dbImg[imgNeeded] ? `<img src="${dbImg[imgNeeded]}">` : `
                                <div class="flex flex-col items-center opacity-60">
                                    <span class="text-xs">📷</span>
                                    <span class="text-[7px] text-blue-600 font-bold uppercase">Foto ${imgNeeded}</span>
                                </div>`}
                        </div><div class="tile-text">${it}</div></div>`;
                }).join('');
                setupSortable('dom', word);
            } 
            else if(type === 'anagramme') {
                const shuffled = word.split('').sort(()=>Math.random()-0.5);
                stage.innerHTML = `<div class="flex flex-col items-center gap-6">
                    <div class="w-32 h-32 border-2 border-blue-900 rounded-lg overflow-hidden bg-white shadow-md" onclick="pickImg('${word}')">
                        ${dbImg[word]?`<img src="${dbImg[word]}" class="h-full w-full object-contain">`:'📷'}</div>
                    <div id="target" class="flex gap-1 min-h-[50px] min-w-[240px] border-b-2 border-blue-200 items-end pb-1"></div>
                </div>`;
                pool.innerHTML = shuffled.map(l => `<div class="letter-tile" data-letter="${l}">${l.toUpperCase()}</div>`).join('');
                setupSortable('ana', word);
            }
        }

        function setupSortable(mode, targetWord) {
            const pool = document.getElementById('pool');
            const target = document.getElementById('target');
            new Sortable(pool, { group: 'game', sort: false });
            new Sortable(target, { 
                group: 'game',
                onAdd: (e) => {
                    if(mode === 'dom') {
                        const nextItem = items[curStep + 1] || items[0];
                        if(e.item.getAttribute('data-word') === nextItem) validate(true);
                        else { alert("Riprova!"); e.item.remove(); }
                    } else {
                        const current = Array.from(target.children).map(el=>el.getAttribute('data-letter')).join('');
                        if(current === targetWord) validate(true);
                    }
                }
            });
        }

        function validate(correct) {
            if(correct) { confetti(); status[curStep]='completed'; setTimeout(()=>loadStep(curStep < items.length-1 ? curStep+1 : 0), 1200); }
            else status[curStep]='error';
            renderNav();
        }

        function renderNav() {
            document.getElementById('nav-step').innerHTML = items.map((_, i) => `<div class="step-pill ${i===curStep?'active':''} ${status[i]}" onclick="loadStep(${i})">${i+1}</div>`).join('');
        }

        function switchLvl(l) { 
            curLvl = l; 
            document.getElementById('btn-f').className = l==='f' ? 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white shadow-md' : 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800';
            document.getElementById('btn-d').className = l==='d' ? 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white shadow-md' : 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800';
            initGame();
        }

        function pickImg(k) { activeKey = k; document.getElementById('imgInp').click(); }
        function pickAud(k) { activeKey = k; document.getElementById('audInp').click(); }
        function handleImg(e) { const r = new FileReader(); r.onload=(ev)=>{dbImg[activeKey]=ev.target.result; loadStep(curStep);}; r.readAsDataURL(e.target.files[0]); }
        function handleAud(e) { const r = new FileReader(); r.onload=(ev)=>{dbAud[activeKey]=ev.target.result; alert("Audio MP3 salvato!");}; r.readAsDataURL(e.target.files[0]); }
        function playConsigne() { 
            const key = curLvl === 'f' ? 'con-f' : 'con-d';
            if(dbAud[key]) {
                const a = new Audio(dbAud[key]);
                a.play().catch(e => console.error(e));
            } else { 
                const m=new SpeechSynthesisUtterance(document.getElementById(key).value); 
                m.lang='fr-FR'; window.speechSynthesis.speak(m); 
            }
        }
        function downloadGame() {
    // 1. Prepariamo i dati da salvare
    const configData = {
        unite: document.getElementById('in-unite').value,
        titre: document.getElementById('in-titre').value,
        items: items,
        dbImg: dbImg,
        dbAud: dbAud,
        typeF: document.getElementById('type-f').value,
        conF: document.getElementById('con-f').value,
        typeD: document.getElementById('type-d').value,
        conD: document.getElementById('con-d').value
    };

    // 2. Cloniamo l'intero HTML della pagina
    let docHtml = document.documentElement.outerHTML;

    // 3. Puliamo l'HTML dai valori correnti per evitare conflitti
    // Rimuoviamo la parte dell'editor (la colonna di sinistra) per il file finale se vuoi solo il gioco
    // In questo esempio lo lasciamo ma iniettiamo lo script di auto-caricamento

    const scriptIniezione = `
    <script>
        window.onload = function() {
            const data = ${JSON.stringify(configData)};
            document.getElementById('in-unite').value = data.unite;
            document.getElementById('in-titre').value = data.titre;
            document.getElementById('items-list').value = data.items.join('; ');
            document.getElementById('type-f').value = data.typeF;
            document.getElementById('con-f').value = data.conF;
            document.getElementById('type-d').value = data.typeD;
            document.getElementById('con-d').value = data.conD;
            
            // Ripristiniamo i database
            dbImg = data.dbImg;
            dbAud = data.dbAud;
            
            // Avviamo il gioco
            initGame();
        };
    <\/script>`;

    // Inseriamo lo script prima della chiusura del body
    const finalHtml = docHtml.replace('</body>', scriptIniezione + '</body>');

    const blob = new Blob([finalHtml], {type: 'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gioco_' + (configData.titre || 'bsmart') + '.html';
    a.click();
}
    </script>
</body>
</html>
