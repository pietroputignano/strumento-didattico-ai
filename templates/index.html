<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loustics Factory - Visual Mapper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --hfle-blue: #0169B3; --hfle-orange: #EFA92C; --hfle-success: #8dc549; --hfle-error: #d84157; }
        body { font-family: 'Source Sans Pro', sans-serif; background-color: #f1f5f9; }
        .h-titre { font-family: 'Montserrat', sans-serif; font-weight: 700; color: var(--hfle-blue); text-shadow: rgb(255, 255, 255) 4px 0px 0px, rgb(255, 255, 255) 3.8px 1px 0px; }
        .h-unite-bar { background-color: var(--hfle-blue); color: white; padding: 12px; text-transform: uppercase; font-weight: 700; text-align: center; }
        .step-pill { width: 35px; height: 35px; border-radius: 10px; background: #7CB5DD; color: white; display: flex; align-items: center; justify-content: center; font-weight: 700; cursor: pointer; }
        .step-pill.active { background-color: var(--hfle-blue); transform: scale(1.1); }
        .step-pill.completed { background-color: var(--hfle-success); }
        
        /* VISUAL MAPPER STYLES */
        #mapper-modal { background: rgba(0,0,0,0.8); z-index: 100; }
        .mapper-zone { 
            position: absolute; border: 2px dashed #EFA92C; background: rgba(239, 169, 44, 0.3); 
            cursor: grab; display: flex; align-items: center; justify-content: center;
        }
        .mapper-zone:active { cursor: grabbing; }
        .resize-handle {
            position: absolute; right: -5px; bottom: -5px; width: 15px; height: 15px; 
            background: #0169B3; border-radius: 50%; cursor: se-resize;
        }
        .zone-label { background: white; color: black; font-size: 10px; font-weight: bold; padding: 2px 4px; border-radius: 4px; }
    </style>
</head>
<body class="p-2 md:p-4">

    <div id="mapper-modal" class="fixed inset-0 hidden flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl max-h-[90vh] flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-blue-50 rounded-t-xl">
                <h3 class="font-bold text-blue-900 text-lg">🗺️ Visual Mapper: Dressing Game</h3>
                <button onclick="closeMapper()" class="text-red-500 font-bold hover:bg-red-100 p-2 rounded">Chiudi & Salva</button>
            </div>
            <div class="p-4 flex gap-4 bg-gray-100 border-b">
                <button onclick="pickImg('mapper_bg')" class="bg-blue-600 text-white px-4 py-2 rounded shadow font-bold text-sm">1. Carica Sfondo</button>
                <button onclick="addZone()" class="bg-orange-500 text-white px-4 py-2 rounded shadow font-bold text-sm">2. Aggiungi Zona (Incastro)</button>
            </div>
            <div class="flex-grow overflow-auto p-4 flex justify-center items-start bg-slate-300">
                <div id="mapper-container" class="relative bg-white shadow-lg border-2 border-gray-400" style="width: 400px; height: 400px;">
                    <img id="mapper-bg-preview" src="" class="w-full h-full object-contain pointer-events-none hidden">
                    <p id="mapper-placeholder" class="text-center mt-40 text-gray-400 font-bold">Nessuno sfondo caricato</p>
                    </div>
            </div>
        </div>
    </div>

    <div class="max-w-[1500px] mx-auto flex flex-col lg:flex-row gap-4">
        <div class="lg:w-1/3 bg-white p-5 rounded-xl shadow-lg border-t-8 border-blue-800 overflow-y-auto max-h-[95vh] text-xs">
            <h2 class="text-xl font-bold text-blue-900 mb-4 uppercase italic border-b pb-2 text-center">Configurazione</h2>
            
            <div class="space-y-4">
                <div><p class="font-bold uppercase mb-1">Unité & Titolo</p>
                    <input id="in-unite" type="text" class="w-full p-2 border rounded mb-1" placeholder="UNITÉ 1">
                    <input id="in-titre" type="text" class="w-full p-2 border rounded" placeholder="Titre de l'activité">
                </div>

                <div class="p-3 bg-gray-50 rounded-lg border border-gray-200">
                    <p class="font-bold text-gray-800 uppercase mb-2">Impostazioni Globali</p>
                    <div class="flex gap-2">
                        <button onclick="pickAud('global_ok')" class="flex-1 bg-white border p-1 rounded shadow-sm hover:bg-green-50 text-[10px]">🔊 Suono Corretto</button>
                        <button onclick="pickAud('global_ko')" class="flex-1 bg-white border p-1 rounded shadow-sm hover:bg-red-50 text-[10px]">🔊 Suono Errore</button>
                    </div>
                </div>

                <div class="p-3 bg-blue-50 rounded-lg border border-blue-200 space-y-2">
                    <p class="font-bold text-blue-800 uppercase">Niveau Facile</p>
                    <input id="con-f" type="text" class="w-full p-2 border rounded mb-2" value="Écoute et déguise.">
                    <select id="type-f" class="w-full p-2 border rounded bg-white font-bold text-blue-900" onchange="checkMapperBtn()">
                        <option value="domino">Domino Chain</option>
                        <option value="dressing" selected>Dressing Game</option>
                        <option value="anagramme">Anagramme</option>
                    </select>
                    <button id="btn-mapper-f" onclick="openMapper()" class="w-full bg-orange-100 border border-orange-400 text-orange-800 p-2 rounded shadow-sm font-bold mt-2">🗺️ APRI VISUAL MAPPER</button>
                    <button onclick="pickAud('con-f')" class="bg-white border p-1 rounded w-full shadow-sm hover:bg-gray-50 mt-2">🎵 Audio Consigne</button>
                </div>

                <div class="p-3 bg-orange-50 rounded-lg border border-orange-200 space-y-2">
                    <p class="font-bold text-orange-800 uppercase">Niveau Difficile</p>
                    <input id="con-d" type="text" class="w-full p-2 border rounded mb-2" value="Remets le mot dans l'ordre.">
                    <select id="type-d" class="w-full p-2 border rounded bg-white font-bold text-orange-900" onchange="checkMapperBtn()">
                        <option value="anagramme">Anagramme</option>
                        <option value="domino">Domino Chain</option>
                        <option value="dressing">Dressing Game</option>
                    </select>
                    <button id="btn-mapper-d" onclick="openMapper()" class="w-full bg-orange-100 border border-orange-400 text-orange-800 p-2 rounded shadow-sm font-bold mt-2 hidden">🗺️ APRI VISUAL MAPPER</button>
                    <button onclick="pickAud('con-d')" class="bg-white border p-1 rounded w-full shadow-sm hover:bg-gray-50 mt-2">🎵 Audio Consigne</button>
                </div>

                <div>
                    <p class="font-bold uppercase mb-1">Mots (item1; item2; ...)</p>
                    <textarea id="items-list" class="w-full h-24 p-2 border rounded" placeholder="chapeau; lunettes; sac"></textarea>
                </div>
            </div>
            <button onclick="initGame()" class="w-full mt-4 bg-blue-700 text-white py-3 rounded-lg font-bold shadow-lg hover:bg-blue-800">🚀 AGGIORNA ANTEPRIMA</button>
        </div>

        <div class="lg:w-2/3 bg-white rounded-xl shadow-2xl overflow-hidden flex flex-col min-h-[660px] relative">
            <div id="res-unite" class="h-unite-bar">UNITÉ 1</div>
            <div class="px-6 py-4 flex justify-between items-center border-b">
                <h1 id="res-titre" class="h-titre text-2xl uppercase">TITRE</h1>
                <div class="flex gap-1">
                    <button id="btn-f-view" onclick="switchLvl('f')" class="px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white shadow-md">FACILE</button>
                    <button id="btn-d-view" onclick="switchLvl('d')" class="px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800 shadow-md">DIFFICILE</button>
                </div>
            </div>

            <div class="p-6 flex-grow flex flex-col items-center">
                <div class="flex items-center gap-3 mb-8 bg-slate-50 px-6 py-2 rounded-full border">
                    <p id="res-consigne" class="italic text-gray-700 font-semibold"></p>
                    <button onclick="playConsigne()" class="text-blue-600 text-2xl hover:scale-125 transition">🔊</button>
                </div>
                <div id="main-content" class="w-full flex flex-col items-center gap-8"></div>
                <div id="pool" class="mt-auto p-4 w-full flex flex-wrap justify-center gap-4 border-t border-dashed border-slate-200"></div>
            </div>

            <div id="nav-step" class="p-4 bg-slate-50 border-t flex justify-center gap-2 flex-wrap"></div>
        </div>
    </div>

    <input type="file" id="imgInp" class="hidden" accept="image/*" onchange="handleImg(event)">
    <input type="file" id="audInp" class="hidden" accept="audio/*" onchange="handleAud(event)">

    <script>
        let items = [], dbImg = {}, dbAud = {}, curStep = 0, curLvl = 'f', status = [], activeKey = "";
        let mappedZones = []; // Array per salvare le coordinate delle zone
        let zoneCounter = 0;

        /* --- GESTIONE VISUAL MAPPER --- */
        function checkMapperBtn() {
            document.getElementById('btn-mapper-f').classList.toggle('hidden', document.getElementById('type-f').value !== 'dressing');
            document.getElementById('btn-mapper-d').classList.toggle('hidden', document.getElementById('type-d').value !== 'dressing');
        }

        function openMapper() { document.getElementById('mapper-modal').classList.remove('hidden'); }
        function closeMapper() { document.getElementById('mapper-modal').classList.add('hidden'); initGame(); }

        function addZone() {
            zoneCounter++;
            const container = document.getElementById('mapper-container');
            const zone = document.createElement('div');
            const wordsList = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i);
            const defaultWord = wordsList[zoneCounter-1] || `Item${zoneCounter}`;
            
            zone.className = 'mapper-zone';
            zone.style.left = '40%'; zone.style.top = '40%';
            zone.style.width = '20%'; zone.style.height = '20%';
            zone.dataset.id = zoneCounter;
            zone.dataset.word = defaultWord;
            
            zone.innerHTML = `
                <input type="text" class="zone-label text-center border-none w-16" value="${defaultWord}" onchange="updateZoneWord(this)">
                <div class="resize-handle"></div>
            `;
            
            container.appendChild(zone);
            makeDraggableAndResizable(zone);
        }

        function updateZoneWord(input) { input.parentElement.dataset.word = input.value; }

        function makeDraggableAndResizable(elm) {
            let container = document.getElementById('mapper-container');
            let isResizing = false;

            // Dragging
            elm.onmousedown = function(e) {
                if (e.target.classList.contains('resize-handle') || e.target.tagName === 'INPUT') return;
                e.preventDefault();
                let startX = e.clientX, startY = e.clientY;
                
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; saveZones(); };
                document.onmousemove = (ev) => {
                    ev.preventDefault();
                    let dx = ev.clientX - startX; let dy = ev.clientY - startY;
                    startX = ev.clientX; startY = ev.clientY;
                    
                    let newLeft = ((elm.offsetLeft + dx) / container.offsetWidth) * 100;
                    let newTop = ((elm.offsetTop + dy) / container.offsetHeight) * 100;
                    
                    elm.style.left = Math.max(0, Math.min(newLeft, 100 - parseFloat(elm.style.width))) + '%';
                    elm.style.top = Math.max(0, Math.min(newTop, 100 - parseFloat(elm.style.height))) + '%';
                };
            };

            // Resizing
            const handle = elm.querySelector('.resize-handle');
            handle.onmousedown = function(e) {
                e.preventDefault(); e.stopPropagation();
                let startX = e.clientX, startY = e.clientY;
                
                document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; saveZones(); };
                document.onmousemove = (ev) => {
                    ev.preventDefault();
                    let dx = ev.clientX - startX; let dy = ev.clientY - startY;
                    startX = ev.clientX; startY = ev.clientY;
                    
                    let newWidth = ((elm.offsetWidth + dx) / container.offsetWidth) * 100;
                    let newHeight = ((elm.offsetHeight + dy) / container.offsetHeight) * 100;
                    
                    elm.style.width = Math.max(5, Math.min(newWidth, 100 - parseFloat(elm.style.left))) + '%';
                    elm.style.height = Math.max(5, Math.min(newHeight, 100 - parseFloat(elm.style.top))) + '%';
                };
            };
        }

        function saveZones() {
            mappedZones = [];
            document.querySelectorAll('.mapper-zone').forEach(z => {
                mappedZones.push({
                    word: z.dataset.word,
                    left: z.style.left, top: z.style.top,
                    width: z.style.width, height: z.style.height
                });
            });
        }
        /* --- FINE VISUAL MAPPER --- */

        function initGame() {
            items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i);
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('res-titre').innerText = document.getElementById('in-titre').value || "ACTIVITÉ";
            status = new Array(items.length).fill('pending');
            checkMapperBtn();
            loadStep(0);
        }

        function loadStep(idx) {
            if(items.length === 0) return;
            curStep = idx; renderNav();
            const stage = document.getElementById('main-content');
            const pool = document.getElementById('pool');
            const word = items[idx];
            const type = curLvl === 'f' ? document.getElementById('type-f').value : document.getElementById('type-d').value;
            const consigne = curLvl === 'f' ? document.getElementById('con-f').value : document.getElementById('con-d').value;
            
            document.getElementById('res-consigne').innerText = consigne;

            if(type === 'dressing') {
                // Inietta il Dressing Game usando le coordinate del Mapper
                const bgHtml = dbImg['mapper_bg'] ? `<img src="${dbImg['mapper_bg']}" class="w-full h-full object-contain pointer-events-none">` : `<p class="text-gray-400 mt-20 text-center">Nessuno sfondo.<br>Usa il Visual Mapper.</p>`;
                
                let targetZonesHtml = '';
                if(mappedZones.length > 0) {
                    const currentZone = mappedZones.find(z => z.word === word);
                    if(currentZone) {
                        targetZonesHtml = `<div id="target" class="absolute border-2 border-dashed border-blue-400 rounded-lg bg-blue-100 bg-opacity-30" 
                            style="left:${currentZone.left}; top:${currentZone.top}; width:${currentZone.width}; height:${currentZone.height};"></div>`;
                    }
                } else {
                    targetZonesHtml = `<div id="target" class="absolute border-2 border-dashed border-red-400 rounded-lg bg-red-100 bg-opacity-30 flex items-center justify-center text-[8px] text-red-500 font-bold" 
                            style="left:40%; top:40%; width:20%; height:20%;">NO MAPPER</div>`;
                }

                stage.innerHTML = `<div class="relative w-[300px] h-[300px] bg-white border-4 border-slate-200 rounded-xl shadow-inner overflow-hidden">
                    ${bgHtml} ${targetZonesHtml}
                </div>`;
                
                pool.innerHTML = items.map(it => `
                    <div class="w-20 h-20 bg-white border-2 border-slate-300 rounded-lg shadow cursor-grab flex items-center justify-center p-1" data-word="${it}">
                        ${dbImg[it] ? `<img src="${dbImg[it]}" class="max-h-full">` : `<span class="text-[8px] text-center" onclick="pickImg('${it}')">📷 Foto<br>${it}</span>`}
                    </div>`).join('');
                setupSortable('dressing', word);
            }
            // ... (Domino e Anagramme rimangono identici allo step precedente) ...
        }

        function setupSortable(mode, targetWord) {
            const pool = document.getElementById('pool');
            const target = document.getElementById('target');
            new Sortable(pool, { group: 'game', sort: false, animation: 150 });
            new Sortable(target, { 
                group: 'game', animation: 150,
                onAdd: (e) => {
                    const droppedWord = e.item.getAttribute('data-word') || e.item.getAttribute('data-letter');
                    if(mode === 'dressing') {
                        if(droppedWord === targetWord) {
                            e.item.style.border = 'none'; e.item.style.background = 'transparent';
                            validate(true);
                        } else { alert("Riprova!"); e.item.remove(); validate(false); }
                    }
                }
            });
        }

        function validate(correct) {
            if(correct) { 
                confetti(); status[curStep]='completed'; 
                if(dbAud['global_ok']) new Audio(dbAud['global_ok']).play();
                setTimeout(()=>loadStep(curStep < items.length-1 ? curStep+1 : 0), 1200); 
            }
            else {
                status[curStep]='error';
                if(dbAud['global_ko']) new Audio(dbAud['global_ko']).play();
            }
            renderNav();
        }

        function renderNav() { document.getElementById('nav-step').innerHTML = items.map((_, i) => `<div class="step-pill ${i===curStep?'active':''} ${status[i]}" onclick="loadStep(${i})">${i+1}</div>`).join(''); }

        function switchLvl(l) { 
            curLvl = l; 
            document.getElementById('btn-f-view').className = l==='f' ? 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white shadow-md' : 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800';
            document.getElementById('btn-d-view').className = l==='d' ? 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white shadow-md' : 'px-4 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800';
            initGame();
        }

        function pickImg(k) { activeKey = k; document.getElementById('imgInp').click(); }
        function pickAud(k) { activeKey = k; document.getElementById('audInp').click(); }
        function handleImg(e) { 
            const r = new FileReader(); 
            r.onload=(ev)=>{
                dbImg[activeKey]=ev.target.result; 
                if(activeKey === 'mapper_bg') {
                    document.getElementById('mapper-bg-preview').src = ev.target.result;
                    document.getElementById('mapper-bg-preview').classList.remove('hidden');
                    document.getElementById('mapper-placeholder').classList.add('hidden');
                } else { loadStep(curStep); }
            }; 
            r.readAsDataURL(e.target.files[0]); 
        }
        function handleAud(e) { const r = new FileReader(); r.onload=(ev)=>{dbAud[activeKey]=ev.target.result; alert("Audio MP3 salvato in memoria!");}; r.readAsDataURL(e.target.files[0]); }
        function playConsigne() { 
            const key = curLvl === 'f' ? 'con-f' : 'con-d';
            if(dbAud[key]) { new Audio(dbAud[key]).play(); } 
            else { const m=new SpeechSynthesisUtterance(document.getElementById(key).value); m.lang='fr-FR'; window.speechSynthesis.speak(m); }
        }
    </script>
</body>
</html>
