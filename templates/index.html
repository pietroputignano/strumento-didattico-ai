<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur FLE - Studio Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f2f5; }
        .h-unite { background-color: #1e3a8a; color: white; padding: 15px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        .h-activite { background-color: #f8fafc; color: #475569; padding: 10px 20px; font-weight: bold; border-bottom: 2px solid #e2e8f0; }
        .step-pill { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; border: 2px solid #cbd5e1; color: #94a3b8; }
        .step-pill.active { border-color: #1e3a8a; color: #1e3a8a; background: #eff6ff; }
        .step-pill.completed { background-color: #10b981; border-color: #10b981; color: white; }
        
        /* Grafica Domino */
        .domino-tile { border: 3px solid #1e3a8a; border-radius: 12px; display: flex; background: white; overflow: hidden; height: 100px; width: 220px; transition: 0.3s; }
        .tile-img { width: 50%; background: #fff; display: flex; align-items: center; justify-content: center; border-right: 2px dashed #1e3a8a; }
        .tile-img img { max-height: 80%; max-width: 80%; object-fit: contain; }
        .tile-text { width: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px; text-align: center; padding: 5px; }
        
        /* Tasselli Lettere */
        .letter-slot { width: 45px; height: 45px; border: 2px solid #cbd5e1; border-radius: 8px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; }
        .letter-tile { width: 45px; height: 45px; background: #efa92c; color: white; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 20px; cursor: move; box-shadow: 0 4px 0 #c78a1e; }
    </style>
</head>
<body class="p-4">

    <div class="max-w-7xl mx-auto flex flex-col lg:flex-row gap-6">
        <div class="lg:w-1/3 bg-white p-6 rounded-2xl shadow-xl space-y-4 border-t-8 border-blue-900">
            <h2 class="text-xl font-bold text-blue-900 uppercase">Paramètres</h2>
            
            <div class="space-y-3 text-sm">
                <div>
                    <p class="font-bold">Unité</p>
                    <input id="in-unite" type="text" class="w-full p-2 border rounded" placeholder="Unité 1">
                </div>
                <div>
                    <p class="font-bold">Titre de l'activité</p>
                    <input id="in-activite" type="text" class="w-full p-2 border rounded" placeholder="Le domino des objets">
                </div>

                <div class="p-3 bg-blue-50 rounded-lg">
                    <p class="font-bold">Consigne Facile</p>
                    <input id="con-f" type="text" class="w-full p-2 border rounded mb-2" value="Relie les dominos.">
                    <select id="type-f" class="w-full p-2 border rounded text-xs"><option>Domino Chain</option></select>
                </div>

                <div class="p-3 bg-orange-50 rounded-lg">
                    <p class="font-bold">Consigne Difficile</p>
                    <input id="con-d" type="text" class="w-full p-2 border rounded mb-2" value="Remets les lettres en ordre.">
                    <select id="type-d" class="w-full p-2 border rounded text-xs"><option>Letter Drag & Drop</option></select>
                </div>

                <div>
                    <p class="font-bold">Mots (séparés par ;)</p>
                    <textarea id="items-list" class="w-full h-24 p-2 border rounded text-xs" placeholder="lit; armoire; tapis"></textarea>
                </div>
            </div>

            <button onclick="updatePreview()" class="w-full bg-blue-700 text-white py-3 rounded-xl font-bold hover:bg-blue-800 transition">GÉNÉRER L'APERÇU</button>
            <button onclick="downloadGame()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700">TÉLÉCHARGER (.HTML)</button>
        </div>

        <div class="lg:w-2/3 bg-white rounded-2xl shadow-2xl overflow-hidden flex flex-col min-h-[650px]">
            <div id="res-unite" class="h-unite text-center">UNITÉ</div>
            <div id="res-activite" class="h-activite flex justify-between items-center">
                <span id="txt-activite">ACTIVITÉ</span>
                <div class="flex gap-2">
                    <button id="btn-f" onclick="switchLevel('f')" class="px-3 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white">FACILE</button>
                    <button id="btn-d" onclick="switchLevel('d')" class="px-3 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800">DIFFICILE</button>
                </div>
            </div>

            <div class="p-8 flex-grow flex flex-col items-center">
                <p id="res-consigne" class="text-center italic text-gray-600 mb-10 text-lg"></p>
                
                <div id="game-stage" class="w-full flex flex-col items-center gap-8">
                    </div>
            </div>

            <div id="step-nav" class="p-4 bg-slate-100 border-t flex justify-center gap-2"></div>
        </div>
    </div>

    <input type="file" id="imgInp" class="hidden" accept="image/*" onchange="saveImg(event)">
    <input type="file" id="audInp" class="hidden" accept="audio/*" onchange="saveAud(event)">

    <script>
        let items = [];
        let curLvl = 'f';
        let curStep = 0;
        let dbImg = {}; 
        let dbAud = {};
        let activeKey = "";

        function updatePreview() {
            items = document.getElementById('items-list').value.split(';').map(i=>i.trim()).filter(i=>i!=="");
            document.getElementById('res-unite').innerText = document.getElementById('in-unite').value || "UNITÉ";
            document.getElementById('txt-activite').innerText = document.getElementById('in-activite').value || "ACTIVITÉ";
            renderNav();
            loadStep(0);
        }

        function renderNav() {
            const nav = document.getElementById('step-nav');
            nav.innerHTML = items.map((_, i) => `<div class="step-pill ${i===curStep?'active':''}" id="pill-${i}">${i+1}</div>`).join('');
        }

        function loadStep(idx) {
            curStep = idx;
            renderNav();
            const stage = document.getElementById('game-stage');
            const word = items[idx];
            const nextWord = items[idx+1] || items[0]; // Per il domino, colleghiamo alla successiva

            if(curLvl === 'f') {
                document.getElementById('res-consigne').innerText = document.getElementById('con-f').value;
                stage.innerHTML = `
                    <div class="flex flex-col items-center gap-6">
                        <div class="flex items-center gap-4">
                            <div class="domino-tile opacity-50"><div class="tile-img">?</div><div class="tile-text">${word}</div></div>
                            <div class="text-3xl text-blue-300">➜</div>
                            <div id="drop-zone" class="w-[220px] h-[100px] border-4 border-dashed border-blue-200 rounded-xl flex items-center justify-center text-blue-200 font-bold">POSER ICI</div>
                        </div>
                        <div id="options" class="flex gap-4 mt-10">
                            ${items.map(it => `
                                <div class="domino-tile shadow-lg cursor-move active:scale-95" data-word="${it}" onclick="selectTile('${it}')">
                                    <div class="tile-img" onclick="pickImg('${it}')">${dbImg[it]?`<img src="${dbImg[it]}">`:'📷'}</div>
                                    <div class="tile-text">${it}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            } else {
                document.getElementById('res-consigne').innerText = document.getElementById('con-d').value;
                const shuffled = word.split('').sort(()=>Math.random()-0.5);
                stage.innerHTML = `
                    <div class="flex flex-col items-center gap-8">
                        <div class="w-48 h-48 border-4 border-blue-900 rounded-2xl overflow-hidden bg-slate-50 flex items-center justify-center" onclick="pickImg('${word}')">
                            ${dbImg[word]?`<img src="${dbImg[word]}" class="w-full h-full object-cover">`:'📷 CLIC PER IMMAGINE'}
                        </div>
                        <div id="target-slots" class="flex gap-2">
                            ${word.split('').map(()=>`<div class="letter-slot"></div>`).join('')}
                        </div>
                        <div id="letter-bank" class="flex gap-2 mt-4">
                            ${shuffled.map(l => `<div class="letter-tile" onclick="speak('${word}')">${l.toUpperCase()}</div>`).join('')}
                        </div>
                        <button onclick="checkWin()" class="bg-orange-500 text-white px-10 py-3 rounded-full font-bold shadow-lg hover:bg-orange-600">VÉRIFIER</button>
                    </div>
                `;
            }
        }

        // Funzioni Helper per Media
        function pickImg(key) { activeKey = key; document.getElementById('imgInp').click(); }
        function saveImg(e) {
            const r = new FileReader();
            r.onload = (ev) => { dbImg[activeKey] = ev.target.result; updatePreview(); };
            r.readAsDataURL(e.target.files[0]);
        }

        function switchLevel(l) {
            curLvl = l;
            document.getElementById('btn-f').className = l==='f' ? 'px-3 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white' : 'px-3 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800';
            document.getElementById('btn-d').className = l==='d' ? 'px-3 py-1 rounded-full text-xs font-bold border-2 border-blue-800 bg-blue-800 text-white' : 'px-3 py-1 rounded-full text-xs font-bold border-2 border-blue-800 text-blue-800';
            updatePreview();
        }

        function checkWin() {
            confetti();
            if(curStep < items.length - 1) {
                setTimeout(() => loadStep(curStep + 1), 1500);
            } else {
                alert("FÉLICITATIONS !");
            }
        }
    </script>
</body>
</html>
